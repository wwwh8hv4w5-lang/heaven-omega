  draw(t,dt){const sw=2,lw=Math.ceil(W/sw),lh=Math.ceil(H/sw);if(PXW.width!==lw||PXW.height!==lh){PXW.width=lw;PXW.height=lh;}const c=PXW.getContext('2d');c.setTransform(1,0,0,1,0,0);c.fillStyle='#23305f';c.fillRect(0,0,lw,lh);if(!mondeImg)return;
    if(!WD.free){WD.cx+=(WD.x-WD.cx)*Math.min(1,dt/200);WD.cy+=(WD.y-WD.cy)*Math.min(1,dt/200);}this.clampCam();
    const k=WD.s/sw,X=x=>lw/2+(x-WD.cx)*k,Y=y=>lh/2+(y-WD.cy)*k;
    c.save();c.translate(lw/2,lh/2);c.scale(k,k);c.translate(-WD.cx,-WD.cy);c.imageSmoothingEnabled=true;c.drawImage(mondeImg,0,0);
    c.setLineDash([6,6]);c.strokeStyle='rgba(74,58,42,.8)';c.lineWidth=3/k*1.2;for(const[a,b]of PATHS){if(!GS.nodes.includes(a)||!GS.nodes.includes(b))continue;c.beginPath();c.moveTo(NODES[a].x,NODES[a].y);c.lineTo(NODES[b].x,NODES[b].y);c.stroke();}c.setLineDash([]);c.restore();
    c.imageSmoothingEnabled=false;

      if(n.gard){const pulse=((t/300)|0)%2;c.fillStyle='#1c1420';for(let j=-7;j<=7;j++){const hw=7-Math.abs(j);c.fillRect(x-hw-1,y+j,hw*2+3,1);}c.fillStyle=GS.done[GARDS.find(g=>MIS[g].node===id)]?'#4a4458':'#5a0e1a';for(let j=-6;j<=6;j++){const hw=6-Math.abs(j);c.fillRect(x-hw,y+j,hw*2+1,1);}c.fillStyle=pulse?'#ff3a2a':'#ff8a6a';c.fillRect(x-3,y-1,2,1);c.fillRect(x+2,y-1,2,1);}

  WD.moving=false;GS.node=id;worldUI();}

function parseItems(s){const o={};if(!s)return o;for(const p of String(s).split(',')){const[id,n]=p.split('*');if(IT[id])o[id]=(o[id]||0)+(+(n||1));}return o;}
function needLabel(n){if(n.startsWith('g:'))return n.slice(2)+' écus';const[id,c]=n.split('*');return IT[id].n+' ×'+(c||1);}
function haveNeed(n){if(n.startsWith('g:'))return GS.gil>=+n.slice(2);const[id,c]=n.split('*');return(GS.inv[id]||0)>=(+(c||1));}
function payNeed(n){if(n.startsWith('g:'))GS.gil-=+n.slice(2);else{const[id,c]=n.split('*');invAdd(id,-(+(c||1)));}}
function grant(r){const out={g:0,it:{},x:0,ups:[]};if(!r)return out;

  if(o&&o.x)h+='<div class="li"><div class="g"><b>+'+o.x+' points d’expérience</b><p>'+(o.ups.length?esc(o.ups.join(' · ')):'Pour chaque membre du clan.')+'</p></div></div>';
  showScr(h+'</div><div class="pied"><button class="bt or" data-a="qOk">Continuer</button></div></div>');ACT.qOk=()=>{hideScr();res();};});}
/* --- combats de quête : mission créée à la volée, ennemis placés automatiquement --- */
function reachable(id){const M=MAPS[id],g=buildMap(id),seen=new Set(),q=[];const ok=(x,y)=>x>=0&&y>=0&&x<M.w&&y<M.h&&standable(g[y][x]);
  for(const s of M.start){q.push(s);seen.add(s[0]+','+s[1]);}
  while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(seen.has(k)||!ok(nx,ny))continue;if(Math.abs(g[ny][nx].h-g[y][x].h)>2)continue;seen.add(k);q.push([nx,ny]);}}
  return{g,seen};}
const SPAWNC={};
function autoSpawn(id,n){const M=MAPS[id];if(!SPAWNC[id]){const{seen}=reachable(id),st=M.start,cx=st.reduce((s,p)=>s+p[0],0)/st.length,cy=st.reduce((s,p)=>s+p[1],0)/st.length,c=[];
    for(const k of seen){const[x,y]=k.split(',').map(Number);if(st.some(p=>p[0]===x&&p[1]===y))continue;if(M.judge&&M.judge[0]===x&&M.judge[1]===y)continue;if(M.guest&&M.guest.some(p=>p[0]===x&&p[1]===y))continue;c.push({x,y,d:Math.hypot(x-cx,y-cy)});}
    c.sort((a,b)=>b.d-a.d);const out=[];for(const sp of[3,2,1])for(const p of c){if(out.length>=10)break;if(out.includes(p)||out.some(q=>Math.abs(q.x-p.x)+Math.abs(q.y-p.y)<sp))continue;out.push(p);}
    SPAWNC[id]=out.map(p=>[p.x,p.y]);}
  return SPAWNC[id].slice(0,n);}
function parseE(s){return String(s).split(',').map(p=>{const m=p.trim().match(/^([a-z_]+)([+-]\d+)?$/);return[m[1],m[2]?+m[2]:0];});}
function questMission(key,z,name,desc,e,r,opt){const Z=ZONES[z],sp=parseE(e),pos=autoSpawn(Z.map,sp.length),boss=/[+][2-9]/.test(e);

  if(Z.sansloi)M.law=null;const it=parseItems(r&&r.i);if(Object.keys(it).length)M.items=it;Object.assign(M,opt||{});MIS[key]=M;return key;}

/* --- déroulement d'une étape (lieu, étape d'annexe) --- */
async function runStep(z,st,key){
  await questScene(z,st.i,st.npc);
  if(st.t==='x'){const c=st.c||[];const k=await choose(st.n,c.map((o,i)=>({l:o[0],or:i===0,dis:!!(o[2]&&o[2].g<0&&GS.gil<-o[2].g),s:o[2]&&o[2].g<0&&GS.gil<-o[2].g?'Pas assez d’écus':''})));
    const ch=c[k];await sayMore([ch[1]]);const o=grant(ch[2]);await rewardPanel(st.n,o);return true;}
  if(st.t==='l'){const have=haveNeed(st.need);const k=await choose(st.n,[{l:'Donner : '+needLabel(st.need),or:1,dis:!have,s:have?'':'Vous n’en avez pas assez'},{l:'Revenir plus tard',pl:1}],'Demande : <b>'+esc(needLabel(st.need))+'</b>.');
    if(k!==0)return false;payNeed(st.need);await sayMore([st.o]);await rewardPanel(st.n,grant(st.r));return true;}
  if(st.t==='c'){const k=await choose(st.n,[{l:'Combattre',or:1},{l:'Pas maintenant',pl:1}],'Adversaires : '+esc(foesLabel(st.e))+'.');if(k!==0)return false;
    questMission(key,z,st.n,st.d,st.e,st.r);const res=await questBattle(key);if(res!=='win')return false;
    if(st.o){const Z=ZONES[z],ops=[['bg',Z.bg],['in','elio',.34,'L']];if(st.npc)ops.push(['in',whoKey(st.npc),.7,'R']);ops.push(lineOp(st.o));await runScript(ops);}
    return true;}
  return true;}
function foesLabel(e){const cnt={};for(const[k]of parseE(e)){const n=MON[k]?MON[k].n:JOBS[k]?JOBS[k].n:k;cnt[n]=(cnt[n]||0)+1;}return Object.keys(cnt).map(k=>k+(cnt[k]>1?' ×'+cnt[k]:'')).join(', ');}
/* --- marqueurs d'une zone --- */
const zDone=z=>ZONES[z].poi.filter(p=>ZQ().done[p[0]]).length;

  keepScroll();showClanScr(h);startVue();}
function tabEq(u){let h='';if(!eqSlot){h+='<p class="note">Touchez un emplacement pour changer d’équipement. Chaque pièce se voit sur le soldat : armure, cape, épaulières, écharpe, bottes, bijoux et arme.</p>';

  let any=false;const ids=Object.keys(GS.inv).filter(i=>GS.inv[i]>0&&IT[i].k===eqSlot).sort((a,b)=>itemScore(u,b)-itemScore(u,a));

function tabJob(u){let h='<div class="djob">';for(const j of PLAYER_JOBS){const ok=jobOk(u,j),L=Object.assign({},lookOf(u),{job:j,wid:undefined,aid:null}),m=mastCount(u,j);

const APP={hs:[['Court',0],['Long',1],['Queue',2],['Carré',3],['Rasé',4]],hair:['#6b3f1d','#1c1a24','#e6d08a','#c2412d','#58a85c','#4a78d0','#9a9aa6','#8a4ab0','#eeeeee','#f08aa8'],
  skin:['#f6d9c0','#f2c9a0','#eac4a2','#d9a070','#b98560','#8a5a3a'],col:['#c8402f','#3a6fd8','#3f8f5a','#e6a52c','#6a3aa0','#2f7f8f','#8a3a3a','#1f2a52','#f2f2f2','#2a2630'],
  cape:[null,'#7a1c22','#1f2a52','#2a2238','#3f6a3a','#d9a441','#eef2ff','#4a1c4a'],gear:[['Auto','auto'],['Aucun',null],['Bandeau','bandeau'],['Capuche','capuche'],['Bonnet','bonnet'],['Chapeau','chapeau'],['Casque','casque']]};
function tabApp(u){const L=lookOf(u),a=u.app||{};const sw=(k,list)=>'<div class="sw">'+list.map((c,i)=>'<button class="'+((L[k]||null)===c||(k==='cape'&&!L.cape&&!c)?'on':'')+'" style="background:'+(c||'transparent')+'" data-a="aSet" data-v="'+k+':'+i+'" aria-label="'+k+' '+(i+1)+'">'+(c?'':'∅')+'</button>').join('')+'</div>';
  let h='<p class="note">Personnalisez l’allure de '+esc(u.name)+'. Le résultat se voit partout : carte, combats, scènes et portraits.</p>';

  h+='<div class="sec">Cheveux</div>'+sw('hair',APP.hair)+'<div class="sec">Peau</div>'+sw('skin',APP.skin)+'<div class="sec">Couleur du clan (tenue)</div>'+sw('col',APP.col)+'<div class="sec">Cape</div>'+sw('cape',APP.cape);
  h+='<div class="sec">Couvre-chef</div><div class="row">'+APP.gear.map(([l,v],i)=>'<button class="bt sm'+((a.gear===undefined?'auto':a.gear)===v?' or':'')+'" data-a="aSet" data-v="gear:'+i+'">'+l+'</button>').join('')+'</div>';
  if(!L.fem)h+='<div class="sec">Barbe</div><div class="row"><button class="bt sm'+(L.beard?'':' or')+'" data-a="aSet" data-v="beard:0">Sans</button><button class="bt sm'+(L.beard?' or':'')+'" data-a="aSet" data-v="beard:1">Avec</button></div>';
  return h+'<div class="row" style="margin-top:12px"><button class="bt sm pl" data-a="aReset">Apparence d’origine</button></div>';}
ACT.aSet=v=>{const u=unitById(unitSel),[k,i]=v.split(':');u.app=u.app||{};
  if(k==='hs')u.app.hs=+i;else if(k==='gear')u.app.gear=APP.gear[+i][1];else if(k==='beard')u.app.beard=+i?1:0;else u.app[k]=APP[k][+i];

function vueLook(){const u=unitById(unitSel);if(!u)return null;const alt=altUnit(u);return lookOf(alt||u);}
function startVue(){if(VUE.raf)return;const loop=ts=>{const c=$('#vueCv');if(!c){VUE.raf=0;return;}drawVue(c,ts);VUE.raf=requestAnimationFrame(loop);};VUE.raf=requestAnimationFrame(loop);}
function stopVue(){if(VUE.raf)cancelAnimationFrame(VUE.raf);VUE.raf=0;}
function drawVue(c,ts){const g=c.getContext('2d'),w=c.width,h=c.height,L=vueLook();if(!L)return;g.imageSmoothingEnabled=false;
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#222c62');gr.addColorStop(.7,'#121a40');gr.addColorStop(1,'#0a0f28');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,233,176,.07)';g.beginPath();g.moveTo(w*.38,0);g.lineTo(w*.62,0);g.lineTo(w*.8,h);g.lineTo(w*.2,h);g.closePath();g.fill();
  for(let i=0;i<14;i++){const x=(hash(i,1,9)*w+ts*.004*(1+hash(i,2,9)))%w,y=h-((hash(i,3,9)*h+ts*.008*(1+hash(i,4,9)))%h);g.fillStyle=i%3?'rgba(255,233,176,.35)':'rgba(170,200,255,.4)';g.fillRect(x|0,y|0,1,1);}
  // socle isométrique
  const cx=w/2,cy=h-14;const row=(j,dy,c)=>{const hw=j<9?(j+1)*2:(18-j)*2;g.fillStyle=c;g.fillRect(cx-hw,cy-9+j+dy,hw*2,1);};
  for(let j=0;j<18;j++){row(j,5,'#0b0f24');row(j,4,j<9?'#2a2f48':'#3a3f5c');}
  for(let j=0;j<18;j++)row(j,0,j===0||j===17?'#0b0f24':((j+((j>8)?1:0))%4===0?'#5a6078':'#6a7090'));
  g.fillStyle='#d9a441';for(let j=4;j<14;j++){const hw=j<9?(j+1)*2-12:(18-j)*2-12;if(hw>0){g.fillRect(cx-hw,cy-9+j,1,1);g.fillRect(cx+hw-1,cy-9+j,1,1);}}
  g.fillStyle='rgba(10,8,20,.45)';g.fillRect(cx-7,cy-1,14,3);
  const d=VUE.dir,back=d>=2,flip=d===1||d===2,el=ts-VUE.t0;let pose='idle';
  if(VUE.pose==='walk')pose=((ts/170)|0)%2?'walk':'idle';else if(VUE.pose==='swing'){const k=(el%1100)/1100;pose=k<.35?'raise':k<.6?'swing':'idle';}else if(VUE.pose==='cast')pose='cast';
  drawPix(g,L,cx,cy+1,{back,flip,pose,t:ts,ph:0});}

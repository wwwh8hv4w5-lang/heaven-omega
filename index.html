<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<title>Heaven Omega</title>
<style>
/* Mise en page : un seul écran. Le canvas porte le monde en pixel art (combat, carte, scènes) ; les fenêtres bleues bordées de clair, à la manière de FFTA, se posent dessus. */
:root{
  color-scheme:dark;
  --nuit:#11162c; --encre:#1c2447; --encre2:#2b3768;
  --velin:#f4ecd6; --velin2:#e5d8b6; --texte:#f2f4ff; --doux:#b9c2e6; --fen1:#2c4a9a; --fen2:#18286a; --bord:#e6ecff; --bord2:#7d8fd0; --fond:#101a3a;
  --or:#d9a441; --or2:#8a6a2a; --rouge:#c2412d; --bleu:#3a6fd8; --vert:#3f9a5c;
  --titre:"Palatino","Palatino Linotype","Book Antiqua","Iowan Old Style",Georgia,serif;
  --corps:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--nuit);color:var(--velin);font-family:var(--corps);overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}

.bt{min-height:44px;padding:8px 16px;border-radius:6px;border:2px solid var(--bord);background:linear-gradient(#3a5cb8,#1f347e);color:#fff;font-weight:600;font-size:15px;letter-spacing:.2px;box-shadow:inset 0 0 0 1px var(--bord2),0 2px 0 #0a0f2a}
.bt:active{transform:translateY(1px)}
.bt:disabled{opacity:.42;cursor:default}
.bt.or{background:linear-gradient(#f2d27a,#c89a32);color:#2a1c05;border-color:#fff6d8;box-shadow:inset 0 0 0 1px #a07a2a,0 2px 0 #0a0f2a}
.bt.pl{background:rgba(10,16,48,.5);border-color:var(--bord2);color:var(--texte);box-shadow:none}
.bt.sm{min-height:36px;padding:4px 10px;font-size:13px}
.bt.rg{background:linear-gradient(#c9523f,#8a2a1c);border-color:#ffd8d0}

.pan{background:linear-gradient(180deg,var(--fen1),var(--fen2));color:var(--texte);border:2px solid var(--bord);border-radius:8px;box-shadow:inset 0 0 0 2px var(--bord2),0 8px 24px rgba(0,0,0,.5)}

/* HUD combat */
#hudTop{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#hudTop>*{pointer-events:auto}
#ordre{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden;padding:4px;background:rgba(17,22,44,.72);border:1px solid #4a558c;border-radius:8px}
#ordre .o{position:relative;flex:0 0 auto;width:38px;height:38px;border-radius:6px;border:2px solid #7fb0ff;background:var(--fond);overflow:hidden}
#ordre .o.e{border-color:#ff7a68} #ordre .o.g{border-color:#7fe09a}
#ordre .o:first-child{width:46px;height:46px;box-shadow:0 0 0 2px var(--or)}
#ordre canvas{width:100%;height:100%;display:block}
#loiBt{flex:0 1 auto;max-width:34%;text-align:left;padding:6px 10px;border-radius:8px;border:2px solid var(--bord);background:linear-gradient(180deg,var(--fen1),var(--fen2));box-shadow:inset 0 0 0 1px var(--bord2);color:var(--texte);font-size:12px;line-height:1.25}
#loiBt b{display:block;font-family:var(--titre);font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:#ffe9b0}
#hudTop .hb{display:flex;gap:6px;flex:0 0 auto}
#hudTop .ic{width:44px;height:44px;border-radius:8px;border:2px solid var(--bord);background:linear-gradient(#3a5cb8,#1f347e);box-shadow:inset 0 0 0 1px var(--bord2);color:#fff;font-size:18px;font-weight:700;padding:0}

#hudBot{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;pointer-events:none}
#hudBot>*{pointer-events:auto}
#fiche{flex:0 1 330px;max-width:340px;display:flex;gap:8px;align-items:center;padding:8px 10px}
#fiche canvas{width:64px;height:64px;border-radius:4px;background:var(--fond);border:2px solid #0b0f24;flex:0 0 auto}
#fiche .nm{font-family:var(--titre);font-size:17px;font-weight:700;line-height:1.1}
#fiche .jb{font-size:12px;color:var(--doux)}
.bar{position:relative;height:8px;border-radius:2px;background:#0b1030;border:1px solid #0b0f24;overflow:hidden;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar.hp i{background:linear-gradient(#63c66f,#2f8f47)} .bar.mp i{background:linear-gradient(#6aa6f0,#3466c4)} .bar.ap i{background:linear-gradient(#e7b750,#c18a2b)}
.num{font-variant-numeric:tabular-nums;font-size:11px;color:var(--doux)}
.st{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;background:#6a4ab0;color:#fff;margin-right:3px}
#cmd{flex:1 1 260px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:flex-end;max-height:46vh;overflow-y:auto;touch-action:pan-y}
#cmd .bt{flex:0 0 auto}
#cmd .liste{flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
#cmd .liste .bt{text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}
#cmd .liste .bt small{font-weight:400;opacity:.85;font-size:11px}
#cmd .liste .bt.interdit{border-color:#e0563f;box-shadow:0 0 0 2px rgba(224,86,63,.5)}
#prev{flex:1 1 100%;padding:8px 12px;font-size:13px;line-height:1.35}
#prev b{font-family:var(--titre);font-size:15px}
#prev .alerte{color:#a0281a;font-weight:700}
#prev .faveur{color:#2f7a45;font-weight:700}
#aide{flex:1 1 100%;text-align:center;font-size:13px;color:#fff6dc;text-shadow:0 1px 3px #000;padding:2px}

.ico{width:32px;height:32px;flex:0 0 auto;image-rendering:pixelated;background:#0e1640;border:1px solid var(--bord2);border-radius:4px}
.ico.vide{display:inline-block;opacity:.5}
.ico.s{width:24px;height:24px;background:transparent;border:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:6px;background:rgba(10,16,48,.55);border:1px solid var(--bord2);font-size:13px}
.chip b{color:#ffe9b0}
#bmenu .ls .bt.it{justify-content:flex-start}#bmenu .ls .bt.it small{margin-left:auto}
#bmenu{position:absolute;z-index:22;display:flex;flex-direction:column;gap:4px;padding:8px;min-width:170px;max-width:min(300px,calc(100% - 16px));max-height:56vh;overflow-y:auto;touch-action:pan-y}
#bmenu .mt{font-family:var(--titre);font-size:15px;color:#ffe9b0;padding:0 2px 2px}
#bmenu .bt{text-align:left;min-height:40px}
#bmenu .ls{display:flex;flex-direction:column;gap:4px}
#bmenu .ls .bt{display:flex;justify-content:space-between;gap:10px;align-items:center}
#bmenu .ls small{font-weight:400;opacity:.85;font-size:11px;white-space:nowrap}
#bmenu .bt.interdit{border-color:#ff8a7a;box-shadow:inset 0 0 0 1px #ff8a7a}
#bmenu .bt.interdit small{color:#ffb0a4;opacity:1}
#bcarte{position:absolute;z-index:22;padding:8px 10px;min-width:210px;max-width:290px;font-size:13px;line-height:1.4}
#bcarte b{font-family:var(--titre);font-size:15px;color:#ffe9b0}
#bcarte .cn{color:#ffe9b0}
#bcarte .alerte{color:#ff9a8a;font-weight:700}
#bcarte .faveur{color:#9be3b0;font-weight:700}
#bcarte .row{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
#bfleches .fl{position:absolute;z-index:22;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;padding:0;font-size:20px;display:grid;place-items:center}
#baide{position:absolute;z-index:21;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;padding:6px 8px 6px 14px;font-size:13px;max-width:calc(100% - 20px)}
#loupe{position:absolute;z-index:26;width:132px;height:132px;border-radius:50%;border:3px solid var(--bord);box-shadow:0 0 0 2px #18286a,0 8px 20px rgba(0,0,0,.6);pointer-events:none}
#info{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 32px));padding:14px 16px;z-index:30}
#info h3{margin:0 0 2px;font-family:var(--titre);font-size:20px}
#info .gr{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;margin:8px 0;font-size:12px}
#info .gr b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
#info p{margin:6px 0;font-size:13px;line-height:1.35}

#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:25}
#banner div{display:inline-block;padding:10px 34px;background:linear-gradient(90deg,transparent,rgba(17,22,44,.92) 18%,rgba(17,22,44,.92) 82%,transparent);font-family:var(--titre);font-size:clamp(22px,5vw,38px);font-weight:700;color:#ffe9b0;letter-spacing:1.5px;text-shadow:0 2px 0 #000;animation:ban .45s ease-out both}
#banner small{display:block;font-family:var(--corps);font-size:clamp(12px,2.6vw,16px);font-weight:500;letter-spacing:.4px;color:#f4ecd6;margin-top:2px}
@keyframes ban{from{opacity:0;transform:scaleX(.6)}to{opacity:1;transform:none}}

/* Dialogue */
#dlg{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
#dlgBox{position:relative;width:min(760px,100%);min-height:118px;display:flex;gap:12px;padding:14px 16px 20px;align-items:flex-start}
#dlgPt{width:96px;height:96px;flex:0 0 auto;border-radius:4px;background:var(--fond);border:2px solid #0b0f24}
@media (min-width:700px){#dlgPt{width:128px;height:128px}}
#dlgName{font-family:var(--titre);font-weight:700;font-size:18px;color:#ffe9b0;margin-bottom:2px}
#dlgTxt{font-size:clamp(15px,2.2vw,18px);line-height:1.45;min-height:3em}
#dlg.nar #dlgBox{background:rgba(17,22,44,.9);color:#f4ecd6;border-color:#4a558c;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#dlg.nar #dlgTxt{font-family:var(--titre);font-style:italic;font-size:clamp(16px,2.4vw,20px)}
#dlg.nar #dlgPt,#dlg.nar #dlgName{display:none}
#dlgNext{position:absolute;right:14px;bottom:4px;font-size:14px;color:#ffe9b0;animation:bob 1s ease-in-out infinite}
#dlg.nar #dlgNext{color:var(--or)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
#skip{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:45;min-height:40px;padding:6px 14px;border-radius:20px;border:1px solid rgba(244,236,214,.5);background:rgba(17,22,44,.6);color:#f4ecd6;font-size:13px}
#carton{position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
#carton h1{margin:0;font-family:var(--titre);font-size:clamp(30px,8vw,64px);letter-spacing:2px;color:#ffe9b0;text-shadow:0 3px 0 #000,0 0 30px rgba(217,164,65,.5);animation:tit 1.2s ease-out both;text-wrap:balance}
#carton p{margin:10px 0 0;font-family:var(--titre);font-style:italic;font-size:clamp(15px,3vw,22px);color:#f4ecd6;text-shadow:0 2px 4px #000;animation:tit 1.2s .3s ease-out both}
@keyframes tit{from{opacity:0;letter-spacing:10px;filter:blur(6px)}to{opacity:1;filter:none}}

/* Écrans (menus) */
#scr{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(10,13,30,.55)}
#scr.clair{background:transparent}
#scr .pan{width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#scr .tt{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--bord2)}
#scr .tt h2{margin:0;flex:1;min-width:0;font-family:var(--titre);font-size:clamp(20px,4vw,26px);text-wrap:balance}
#scr .tt .gil{font-variant-numeric:tabular-nums;font-weight:700;color:#ffe9b0;white-space:nowrap}
#scr .cc{padding:12px 16px 16px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;min-height:0}
#scr .onglets{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 0}
#scr .onglets .bt.on{background:linear-gradient(#e7b750,#c18a2b);color:#2a1c05}
.li{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed rgba(230,236,255,.25)}
.li:last-child{border-bottom:0}
.li .g{flex:1;min-width:0}
.li .g b{font-family:var(--titre);font-size:16px}
.li .g p{margin:2px 0 0;font-size:13px;line-height:1.35;color:var(--doux)}
.li canvas.pt{width:64px;height:64px;border-radius:4px;background:var(--fond);border:2px solid #0b0f24;flex:0 0 auto}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:#0e1640;border:1px solid var(--bord2);color:#fff6dc;margin-right:4px;vertical-align:1px}
.tag.h{background:#a0281a}.tag.s{background:#7a5a1c}.tag.v{background:#2f7a45}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:4px 10px;margin:8px 0;font-size:12px;color:var(--doux)}
.stats b{display:block;font-size:16px;color:var(--texte);font-variant-numeric:tabular-nums}
.sec{font-family:var(--titre);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#ffe9b0;margin:14px 0 4px;border-bottom:1px solid var(--bord2);padding-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pied{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:10px 16px 14px;border-top:1px solid var(--bord2)}
.note{font-size:13px;color:var(--doux);line-height:1.4}
input.champ{font:inherit;font-size:18px;padding:8px 10px;border:2px solid var(--bord);border-radius:6px;background:#0e1640;color:var(--texte);width:100%;user-select:text;-webkit-user-select:text}

/* Titre */
#titre{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(420px,100%)}
#titre h1{margin:0;font-family:var(--titre);font-size:clamp(40px,11vw,84px);line-height:.95;color:#ffe9b0;letter-spacing:2px;text-shadow:0 3px 0 #1a1020,0 0 40px rgba(217,164,65,.55);text-wrap:balance}
#titre h1 span{display:block;font-size:.5em;letter-spacing:.5em;margin-right:-.5em;color:#f4ecd6;font-weight:400}
#titre .sous{font-family:var(--titre);font-style:italic;color:#f4ecd6;text-shadow:0 2px 4px #000;margin-bottom:10px}
#titre .bt{width:min(280px,100%)}
#titre .ver{font-size:11px;color:#c9c2dd;text-shadow:0 1px 2px #000}

/* Carte du monde */
#mondeBar{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:linear-gradient(rgba(17,22,44,.9),rgba(17,22,44,0))}
#mondeBar .cl{flex:1;min-width:120px;font-family:var(--titre);font-size:18px;font-weight:700;color:#ffe9b0;text-shadow:0 1px 3px #000}
#mondeBar .cl small{display:block;font-family:var(--corps);font-weight:500;font-size:12px;color:#f4ecd6;font-variant-numeric:tabular-nums}
#mondeBas{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
#mondeBas>*{pointer-events:auto}
#lieu{width:min(560px,100%);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#lieu .g{flex:1;min-width:160px}
#lieu b{font-family:var(--titre);font-size:19px}
#lieu p{margin:2px 0 0;font-size:13px;color:var(--doux);line-height:1.35}

#toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:8px 16px;border-radius:20px;background:rgba(17,22,44,.94);border:1px solid var(--or);color:#ffe9b0;font-size:14px;text-align:center;pointer-events:none}

/* Cinématique du studio */
#fsmIntro{position:absolute;inset:0;z-index:100;background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#lanceur{position:absolute;inset:0;z-index:110;background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#lanceur .lt{font-family:var(--titre);font-size:clamp(18px,4vw,26px);letter-spacing:.4em;margin-right:-.4em;color:#f4ecd6}
#lanceur .lt b{display:block;font-size:2.2em;letter-spacing:.06em;margin-right:0;color:#ffe9b0;text-shadow:0 0 30px rgba(217,164,65,.45)}
#lanceBt{min-height:56px;min-width:min(260px,100%);font-size:18px}
#lanceur .ls{font-size:13px;color:#b9b3cf}
#fsmIntro.att *{animation-play-state:paused}
#fsmIntro.fin{animation:fsmOut .7s ease-in both}
@keyframes fsmOut{from{opacity:1}to{opacity:0;visibility:hidden}}
#fsmLogo{width:min(190px,44vw);height:auto;animation:fsmLogo 1.5s cubic-bezier(.2,.9,.25,1) both}
@keyframes fsmLogo{from{opacity:0;transform:scale(.7) rotate(-8deg);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#fsmNom{font-family:var(--titre);font-size:clamp(24px,6vw,40px);font-weight:700;letter-spacing:3px;color:#f4ecd6;animation:fsmTxt 1s .9s ease-out both}
#fsmPres{font-family:var(--titre);font-style:italic;font-size:clamp(14px,3vw,20px);color:#d9a441;animation:fsmTxt 1s 1.7s ease-out both}
@keyframes fsmTxt{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#fsmPasser{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:44px;padding:8px 18px;border-radius:22px;border:1px solid rgba(244,236,214,.45);background:transparent;color:#f4ecd6;font-size:14px}
/* Clan */
#scr .pan.clanPan{width:min(860px,100%)} #scr .pan.unitPan{width:min(1000px,100%)}
#scr .tt h2 small{display:block;font-family:var(--corps);font-size:12px;font-weight:500;color:var(--doux);letter-spacing:.2px}
#scr .tt .nav{min-width:40px;padding:4px 8px}
.caserne{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.carte{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border-radius:8px;border:2px solid var(--bord2);background:linear-gradient(#22357e,#14215a);color:var(--texte);min-height:44px}
.carte:active{transform:translateY(1px)} .carte.on{border-color:#ffe9b0;box-shadow:0 0 0 2px var(--or)} .carte.off{opacity:.6} .carte:disabled{opacity:.4}
.carte .nm{font-family:var(--titre);font-weight:700;font-size:15px} .carte .jb{font-size:12px;color:var(--doux)}
.carte .eqi{display:flex;gap:2px;margin:2px 0}
canvas.spr{width:80px;height:100px;image-rendering:pixelated;background:radial-gradient(ellipse at 50% 90%,rgba(255,233,176,.18),transparent 60%)}
.unitGrid{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start}
@media (max-width:700px){.unitGrid{grid-template-columns:1fr}}
.vueCol{display:flex;flex-direction:column;gap:6px}
.vue{position:relative;border:2px solid var(--bord);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--bord2);background:#0a0f28}
#vueCv{display:block;width:100%;aspect-ratio:72/80;image-rendering:pixelated;cursor:pointer}
.vueBt{position:absolute;right:6px;top:6px;display:flex;gap:4px}

const mf=m=>440*Math.pow(2,(m-69)/12);
function music(id){if(AU.mus===id)return;AU.mus=id||null;if(AU.timer){clearInterval(AU.timer);AU.timer=null;}if(AU.ctx&&id)musStart();}
function musStart(){if(AU.timer){clearInterval(AU.timer);AU.timer=null;}const m=MUS[AU.mus];if(!m||!AU.ctx||AU.ctx.state!=='running')return;AU.step=0;AU.next=AU.ctx.currentTime+0.08;
  AU.timer=setInterval(()=>{const m=MUS[AU.mus];if(!m||!AU.ctx)return;const sd=30/m.bpm;if(AU.next<AU.ctx.currentTime-0.5)AU.next=AU.ctx.currentTime+0.05;
    while(AU.next<AU.ctx.currentTime+0.25){const s=AU.step,t=AU.next,ch=m.ch[Math.floor(s/8)%m.ch.length],b=s%8;
      if(AU.on){
        if(b===0||b===4)tone(mf(ch[0]-12),t,sd*3.6,'triangle',.2,0,AU.mg);
        tone(mf(ch[[0,1,2,1][b%4]]+12),t,sd*1.4,m.arp,m.arp==='sine'?.07:.035,0,AU.mg);
        const n=m.mel[s%m.mel.length];if(n>0){let len=1;while(len<8&&m.mel[(s+len)%m.mel.length]===0)len++;tone(mf(n),t,sd*len*0.95,'triangle',.13,0,AU.mg);tone(mf(n),t,sd*len*0.6,'square',.025,0,AU.mg);}
        if(m.drum&&(b%2===0)){const g=AU.ctx.createGain();g.gain.value=0.5;g.connect(AU.mg);tone(b%4===0?110:190,t,.07,'square',.05,50,g);}
      }
      AU.step++;AU.next+=sd;}
  },60);}

 ['cyr6','L’école des scribes','Les élèves n’ont plus une seule plume pour écrire.','l','Maîtresse Iris',{i:['Maîtresse Iris|Une plume d’aube suffirait à toute la classe. Elles écrivent toutes seules, celles-là.'],need:'plume*1',o:'Maîtresse Iris|Merci ! Les enfants vous ont écrit un poème. Et moi, je vous offre ces fioles.',r:{i:'ether*2',x:30}}],
 ['cyr7','Le grenier de la boulangère','Des Encriers ont noirci toute la farine.','c','Boulangère Rose',{i:['Boulangère Rose|Du pain noir, j’en fais. Du pain à l’encre, jamais ! Chassez-moi ces bestioles.'],e:'encre,encre,encre,feuillet',o:'Boulangère Rose|Ma farine est sauvée. Revenez quand vous voulez, la miche est offerte.',r:{g:160,i:'potion*2'}}],
 ['cyr8','Le cimetière des brouillons','Des personnages inachevés y errent sans fin.','x','Le Brouillon',{i:['Une silhouette à moitié tracée flotte au-dessus d’une tombe.','Le Brouillon|On m’a commencé, puis oublié. Je n’ai ni nom ni dernière phrase.'],c:[['Lui écrire une fin','Le Brouillon|« Et il se reposa enfin. » … Merci. C’est une bonne fin.',{x:50}],['Le laisser en paix','Le Brouillon|Alors j’attendrai. Prenez ceci : je n’en aurai plus besoin.',{i:'hpotion',g:60}]]}],
 ['cyr9','La tour de l’horloge','Des Feuillets ont fait leur nid dans le mécanisme.','c','Horloger',{i:['Horloger|Midi sonne à trois heures depuis que ces pages s’y sont installées.'],e:'feuillet,feuillet,feuillet,feuillet',o:'Horloger|Il est l’heure de vous payer. Pile à l’heure, cette fois.',r:{g:240}}],
 ['cyr10','L’auberge du Fromage Vert','La cave à fromages préférée de Brann.','x','Aubergiste Gaby',{i:['Brann|Elio. Elio. C’est ici. Le paradis existe et il sent fort.','Aubergiste Gaby|Concours du soir : qui finit le Fromage Noir gagne la tournée.'],c:[['Relever le défi','Brann|… Je ne sens plus mes oreilles. Je n’ai jamais été aussi heureux.',{x:40,g:50}],['Décliner poliment','Aubergiste Gaby|Sage. Tenez, une part de fromage frais pour la route.',{i:'potion*2'}]]}]
],
 tresor:{n:'La clé de la bibliothèque',d:'Glissée sous une dalle de la place.',i:['Sous une dalle descellée, une clé en laiton. Une étiquette : « E. — pour plus tard. »'],item:'t_cyr'},
 rencontre:{n:'Gaspard, juge à la retraite',t:'recrue',who:'Gaspard',job:'mno',race:'hum',look:{skin:'#eac4a2',hair:'#cfcfd8',hs:4,col:'#3b2a66',beard:1},i:['Gaspard|Quarante ans d’Édits, et je m’ennuie à mourir. Votre clan aurait-il besoin d’un vieux mage qui connaît les règles ?'],c:['L’engager','Gaspard|Parfait. Je vous expliquerai les failles de chaque Édit. Il y en a toujours.']}},
pres:{n:'Prés de Lin',bg:'plaine',map:'pres',light:'jour',poi:[
 ['pres1','Le moulin à pages','Ses ailes moulinent du papier au lieu du blé.','c','Meunier Alban',{i:['Meunier Alban|Une Braséole s’est logée dans la meule. Avec les Encriers, ça fait de la cendre noire partout !'],e:'encre,encre,braise',o:'Meunier Alban|Ça tourne rond. Prenez quelques sacs, ils valent leur pesant d’écus.',r:{g:180,i:'potion'}}],
 ['pres2','L’épouvantail lettré','Il récite des vers aux corbeaux.','x','Épouvantail',{i:['Épouvantail|Je cherche une rime à « page ». Les corbeaux ne m’aident jamais.'],c:[['« Voyage »','Épouvantail|Voyage ! Tu as l’âme d’un poète. Prends mon chapeau, il pique un peu.',{x:30,i:'ether'}],['« Fromage »','Brann|C’est la seule rime qui compte.',{g:90}]]}],
 ['pres3','Le champ de virgules','Une chèvre de papier y broute les ponctuations.','l','Fermière Odile',{i:['Fermière Odile|Ma chèvre a avalé un point-virgule de travers. Un remède la soulagerait.'],need:'remede*1',o:'Fermière Odile|Elle bêle de nouveau en phrases complètes. Merci, les enfants.',r:{i:'potion*3',x:20}}],
 ['pres4','La ferme des Roussel','Des racketteurs s’en prennent aux fermiers.','c','Père Roussel',{i:['Père Roussel|Ils reviennent chaque semaine prendre la moitié de la récolte. Cette semaine, vous êtes là.'],e:'vol,arc,sol',o:'Père Roussel|Ils ne reviendront pas. Prenez ces écus, c’était la part qu’on leur gardait.',r:{g:260}}],
 ['pres5','Le puits sans fond','On dit qu’il exauce ceux qui y jettent une pièce.','x','',{i:['Le puits est si profond qu’on n’entend jamais la pièce tomber.'],c:[['Jeter 50 écus','Une plume dorée remonte doucement, portée par un courant d’air chaud.',{g:-50,i:'plume'}],['Écouter seulement','Tout au fond, très loin, on croit entendre une cloche d’école. Elio frissonne.',{x:30}]]}],
 ['pres6','Les ruches d’encre','Des essaims de Feuillets en colère.','c','Apicultrice Mila',{i:['Apicultrice Mila|Mes ruches produisent un miel d’encre très rare. Mais les Feuillets se sont rebellés.'],e:'feuillet,feuillet,feuillet',o:'Apicultrice Mila|Un pot de miel d’encre. Ça redonne des forces aux mages.',r:{i:'ether*2',g:80}}],
 ['pres7','Le vieux pommier','Un enfant est coincé tout en haut.','x','Petit Jules',{i:['Petit Jules|Je voulais voir la fin de la page ! Maintenant je n’ose plus descendre.'],c:[['Elio grimpe','Elio|Accroche-toi à moi. On descend ensemble, branche par branche.',{x:40}],['Brann grimpe','Brann|Les feyrins grimpent comme ils respirent. Allez hop, sur mon dos.',{g:70,i:'potion'}]]}],
 ['pres8','La grange incendiée','Des Braséoles y dansent dans le foin.','c','',{i:['La grange fume. À l’intérieur, des flammes ricanent.'],e:'braise,braise,braise',o:'Le feu s’éteint. Dans les cendres, quelques écus fondus.',r:{g:200}}],
 ['pres9','Le chemin des lavandières','Des lavandières blessées par des Encriers.','l','Lavandière Anne',{i:['Lavandière Anne|Les Encriers nous ont aspergées. On ne peut plus porter les paniers.'],need:'potion*2',o:'Lavandière Anne|Ça va mieux. Prenez ce linge brodé, il protège mieux qu’on croit.',r:{i:'arm1',g:60,x:20}}],
 ['pres10','La pierre levée','Une inscription dans une écriture que seul Elio comprend.','x','',{i:['Gravé dans la pierre, en lettres de Brumeval : « Ici reposent les vacances de juillet. »'],c:[['Recopier l’inscription','Elio|Quelqu’un d’autre est venu ici avant moi. Quelqu’un de chez nous.',{x:50}],['Effleurer la pierre','La pierre est tiède, comme une plage en fin de journée.',{i:'ether',g:40}]]}]
],
 tresor:{n:'Le trèfle de lin',d:'Au cœur du champ le plus ancien.',i:['Entre deux sillons, un trèfle à quatre feuilles tissé en fil de lin.'],item:'t_pres'},
 rencontre:{n:'Roussette, archère des champs',t:'recrue',who:'Roussette',job:'arc',race:'fey',look:{skin:'#d9803c',hair:'#8a3a1a',hs:2,col:'#5a7a3a',fem:1},i:['Roussette|Je chasse les Encriers depuis l’enfance. Vous, vous chassez des Sceaux. Ça a l’air plus amusant.'],c:['L’accueillir','Roussette|Marché conclu. Je vise les yeux, vous visez le reste.']}},
gue:{n:'Gué des Roseaux',bg:'plaine',map:'gue',light:'jour',poi:[
 ['gue1','Le péage abandonné','Une boîte à péage encore pleine.','x','',{i:['La boîte du péage déborde d’écus. Personne ne la garde plus.'],c:[['Prendre les écus','Brann|Les brigands n’en auront plus besoin. Mais on est un clan honnête… à moitié.',{g:150}],['Les laisser aux voyageurs','Un vieux voyageur, témoin de la scène, vous glisse une fiole en souriant.',{i:'hpotion',x:30}]]}],
 ['gue2','Le radeau du passeur','Le passeur ne peut plus traverser.','l','Passeur Melchior',{i:['Passeur Melchior|Mon radeau prend l’eau. 100 écus de cordes et de goudron, et je vous fais traverser gratis à vie.'],need:'g:100',o:'Passeur Melchior|Il flotte ! Tenez, des remèdes que les voyageurs oublient toujours.',r:{i:'remede*2,potion',x:20}}],
 ['gue3','L’îlot aux grenouilles-plumes','Des créatures de papier y coassent.','c','',{i:['Sur l’îlot, des Feuillets et des Encriers se disputent un nénuphar.'],e:'feuillet,feuillet,encre,encre',o:'L’îlot retrouve son calme. Un éclat brille sous le nénuphar.',r:{g:180,i:'ether'}}],
 ['gue4','La cabane d’Odon','Là où Odon soignait les voyageurs.','x','',{i:['Des bocaux d’herbes séchées, une chaise usée, et une note : « Revenir quand Mira sera grande. »'],c:[['Prendre les herbes','Elio|On les lui rapportera. Il dira qu’elles ont perdu leur goût, mais il sera content.',{i:'remede*2'}],['Laisser la cabane intacte','Elio|Certains endroits doivent attendre leur propriétaire.',{x:40}]]}],
 ['gue5','Le gué de la marée d’encre','Une marée noire monte deux fois par jour.','c','',{i:['L’eau du gué noircit. Une Rature remonte avec la marée.'],e:'rature,encre,encre',o:'La marée redescend. Le gué redevient bleu.',r:{g:240}}],
 ['gue6','Le camp des brigands repentis','D’anciens brigands veulent changer de vie.','x','Ancien brigand Tom',{i:['Ancien brigand Tom|Depuis votre passage, on n’ose plus rançonner personne. On voudrait un vrai métier.'],c:[['Les envoyer à Cyrielle','Ancien brigand Tom|Boulangers ? Pourquoi pas. Tenez, notre dernier butin, on n’en veut plus.',{g:200}],['Leur apprendre à soigner','Ancien brigand Tom|Des brigands guérisseurs… Odon va rire. Merci.',{x:50,i:'potion'}]]}],
 ['gue7','Les roseaux chantants','Le vent y joue une mélodie.','x','',{i:['Les roseaux sifflent une mélodie. Elio la reconnaît : la sonnerie de fin des cours, à Brumeval.'],c:[['Fredonner avec eux','Elio|… Lina la chantait en courant. Avant.',{x:40}],['Couper un roseau','Un roseau creux, parfait pour une flûte. Ou pour vendre.',{g:100}]]}],
 ['gue8','Le pêcheur de mots','Il pêche des lettres sous l’eau.','l','Pêcheur Ambroise',{i:['Pêcheur Ambroise|Sous l’eau, les lettres se cachent. Un éther me rendrait la vue claire.'],need:'ether*1',o:'Pêcheur Ambroise|J’ai pêché un « Ω » ! Rare ! Prenez le reste de ma pêche.',r:{g:150,i:'hpotion',x:20}}],
 ['gue9','Le pont effondré','Des brigands s’y sont retranchés.','c','',{i:['Sur les restes du pont, une bande qui n’a pas encore entendu parler de repentir.'],e:'sol,arc,mno',o:'Le pont est libre. Les voyageurs pourront contourner le gué.',r:{g:260,i:'potion'}}],
 ['gue10','La loutre-scribe','Une loutre vole les plumes des voyageurs.','x','Loutre',{i:['Une loutre en papier tient une plume dans sa gueule et vous regarde, très fière d’elle.'],c:[['Lui offrir un poisson-plume','La loutre lâche la plume et vous rapporte, en échange, une petite fiole.',{i:'ether'}],['La laisser filer','Brann|Une collègue. On ne dénonce pas les collègues.',{x:30,g:40}]]}]
],
 tresor:{n:'L’arc des roseaux',d:'Enfoui dans la vase, au milieu des roseaux.',i:['Un arc taillé dans un roseau géant, souple et léger.'],item:'t_gue'},
 rencontre:{n:'Le Brochet-Lettrine',t:'rare',d:'Une lettrine enluminée qui vit dans le gué.',e:'lettrine+1,encre,encre',i:['L’eau bouillonne. Une immense lettrine dorée surgit du gué !'],r:{g:400,i:'hpotion*2,ether*2'}}},
grotte:{n:'Grottes de Vélin',bg:'grotte',map:'grotte',light:'grotte',poi:[
 ['grotte1','La salle des échos','Les échos répètent des phrases pas encore dites.','x','',{i:['L’écho répond avant même qu’Elio parle : « …et ensuite, on rentrera. »'],c:[['Répondre « Oui »','L’écho se tait, satisfait. Une pierre de lune roule à vos pieds.',{i:'ether',x:20}],['Répondre « Pas sûr »','L’écho rit doucement. Il a l’air d’en savoir plus que vous.',{x:50}]]}],
 ['grotte2','Le lac souterrain','Des Encriers nagent dans l’eau noire.','c','',{i:['Le lac est immobile. Puis il ouvre des yeux.'],e:'encre,encre,encre,rature',o:'Le lac redevient miroir.',r:{g:240,i:'potion'}}],
 ['grotte3','Les cristaux chanteurs','L’apprentie de Vellin étudie leur chant.','l','Apprentie Noor',{i:['Apprentie Noor|Les cristaux ne chantent que pour ceux qui ont l’esprit clair. Deux éthers m’aideraient.'],need:'ether*2',o:'Apprentie Noor|Ils chantent ! Voici un éclat, il vibre encore.',r:{i:'acc2,hpotion',x:30}}],
 ['grotte4','La galerie effondrée','Un Golem garde le passage.','c','',{i:['Un Golem de reliure bloque la galerie.'],e:'golem,feuillet,feuillet',o:'La galerie s’ouvre sur une veine de cristal.',r:{g:280}}],
 ['grotte5','L’atelier de Vellin','Ses carnets traînent partout.','x','',{i:['Carnet de Vellin : « Jour 11. Trois enfants. Un quatrième souhait, non prononcé. Il pèse plus lourd que les autres. »'],c:[['Lire la suite','« …Le livre écrit ce qu’on ne dit pas. C’est sa pire habitude. »',{x:60}],['Refermer le carnet','Elio|Il nous l’aurait dit, s’il voulait qu’on le sache.',{i:'remede*2'}]]}],
 ['grotte6','Le puits de lumière','Un rai de jour tombe d’une fissure.','x','',{i:['Un rayon de soleil traverse la roche. Des poussières dorées y dansent.'],c:[['Se tenir dans la lumière','La chaleur détend tous les muscles. Le clan se sent plus fort.',{x:50}],['Ramasser la poussière','Une pincée de poudre dorée dans une fiole.',{i:'plume'}]]}],
 ['grotte7','Le nid des Braséoles','Des flammes vivantes couvent leurs œufs.','c','',{i:['Trois Braséoles se dressent autour d’un nid de braises.'],e:'braise,braise,braise',o:'Les braises s’éteignent. Il fait froid, d’un coup.',r:{g:220,i:'ether'}}],
 ['grotte8','Les fresques','Des peintures très anciennes.','x','',{i:['La fresque montre trois enfants devant un livre. Derrière eux, une quatrième silhouette, effacée.'],c:[['Gratter la peinture','Sous la couche, une main tient un crayon. Elle ressemble à celle d’Elio.',{x:60}],['Laisser la fresque','Brann|Il y a des dessins qu’on ne gratte pas. Même moi, je le sais.',{g:100}]]}],
 ['grotte9','La mine abandonnée','Un mineur blessé appelle à l’aide.','l','Mineur Bastide',{i:['Mineur Bastide|Une pierre m’a écrasé la jambe. Deux remèdes, et je pourrai sortir d’ici.'],need:'remede*2',o:'Mineur Bastide|Je marche ! Prenez ma paye, je vais changer de métier.',r:{g:300,x:20}}],
 ['grotte10','Le gardien de pierre','Il protège l’entrée profonde.','c','',{i:['Un Golem plus ancien que les autres s’éveille. Des Encriers l’escortent.'],e:'golem+1,encre,encre',o:'Le gardien s’effondre en pages de pierre.',r:{g:320,i:'hpotion'}}]
],
 tresor:{n:'Le voile de vélin',d:'Dans une alcôve que seuls les échos connaissent.',i:['Une robe fine comme une page, qui ne se froisse jamais.'],item:'t_grotte'},
 rencontre:{n:'L’ermite cristallin',t:'x',who:'Ermite cristallin',look:{skin:'#c8d4ec',hair:'#eef2ff',hs:4,col:'#5a6ab0',beard:1},i:['Ermite cristallin|Une énigme, voyageurs. Qu’est-ce qui grandit quand on l’écrit, et rétrécit quand on le lit ?'],c:[['« Une histoire »','Ermite cristallin|Presque. C’est l’attente. Mais tu as de l’intuition. Prends ceci.',{i:'hpotion*2,ether',x:40}],['« Un secret »','Ermite cristallin|Exactement. Un secret écrit grandit, un secret lu disparaît. Bravo.',{i:'acc4',x:20}]]}},
dunes:{n:'Dunes d’Ocre',bg:'dunes',map:'dunes',light:'dunes',poi:[
 ['dunes1','L’oasis des Foulées','L’ancien campement du clan de Lina.','x','Petite Sahra',{i:['Petite Sahra|Lina, c’était la plus rapide ! Tu veux faire la course, toi ?'],c:[['Faire la course','Elio|Tu as gagné. Largement. Lina serait fière.',{x:40}],['Partager l’eau','Petite Sahra|Merci. On garde toujours une gourde pour ceux qui reviennent.',{i:'potion*2'}]]}],
 ['dunes2','Le squelette de baleine-livre','Les côtes d’un livre géant échoué.','c','',{i:['Entre les côtes du livre-baleine, des Feuillets ont fait leur nid.'],e:'feuillet,feuillet,feuillet,encre',o:'Dans le ventre du livre, une page de musique intacte.',r:{g:240,i:'ether'}}],
 ['dunes3','La caravane perdue','Des marchands mourant de soif.','l','Caravanier Omar',{i:['Caravanier Omar|Trois jours sans eau. Trois potions, et nous repartons.'],need:'potion*3',o:'Caravanier Omar|Vous nous sauvez. Prenez ce qu’on transportait de plus précieux.',r:{g:400,i:'cui2'}}],
 ['dunes4','Le mirage','Une ville enneigée au milieu du sable.','x','',{i:['Au loin, des toits sous la neige, un phare. Brumeval, en plein désert.'],c:[['Marcher vers lui','Le mirage recule à chaque pas. Elio s’arrête, la gorge serrée.',{x:60}],['Détourner les yeux','Brann|Viens. Les mirages, c’est le désert qui se moque de nous.',{g:90,i:'remede'}]]}],
 ['dunes5','Le temple ensablé','Un Golem veille sur les reliques.','c','',{i:['Les colonnes du temple dépassent à peine du sable. Un Golem et deux Braséoles en gardent l’entrée.'],e:'golem,braise,braise',o:'Le temple livre ses reliques.',r:{g:300,i:'hpotion'}}],
 ['dunes6','Le sablier géant','Le sable y coule vers le haut.','x','',{i:['Le sable du sablier remonte. Un mécanisme permet de le retourner.'],c:[['Le retourner','Le temps reprend son cours normal. Au fond, deux fioles bleues.',{i:'ether*2'}],['Regarder le sable monter','Elio|C’est peut-être ça, le temps ici. Il remonte.',{x:50}]]}],
 ['dunes7','Les pillards du vent','Ils attaquent les caravanes.','c','',{i:['Des voiles claquent : les pillards du vent fondent sur vous.'],e:'vol,vol,arc,sol',o:'Les pillards s’enfuient en abandonnant leur butin.',r:{g:340}}],
 ['dunes8','Le puits d’ocre','Le village n’a plus le droit d’y puiser.','l','Doyenne Leïla',{i:['Doyenne Leïla|Un marchand a acheté le puits. Il faudrait 80 écus pour racheter le droit d’eau.'],need:'g:80',o:'Doyenne Leïla|L’eau est à tout le monde, maintenant. Prenez ces étoffes.',r:{i:'rob1,potion*2',x:30}}],
 ['dunes9','La tente de la diseuse','Elle lit l’avenir dans les marges.','x','Diseuse Zelda',{i:['Diseuse Zelda|30 écus pour une prédiction. Elles sont toujours vraies, mais jamais dans l’ordre.'],c:[['Payer 30 écus','Diseuse Zelda|Tu écriras le dernier mot. Et quelqu’un en ajoutera un autre.',{g:-30,x:80}],['Refuser','Diseuse Zelda|Tu as raison. L’avenir, c’est mieux en surprise.',{i:'remede'}]]}],
 ['dunes10','Le cimetière de chameaux','Des Ratures y rôdent la nuit.','c','',{i:['Entre les os blanchis, deux Ratures griffonnent le sable.'],e:'rature,rature,encre',o:'Le sable se lisse de nouveau.',r:{g:280,i:'ether'}}]
],
 tresor:{n:'La dague de sable',d:'Sous le sablier, quand il est retourné.',i:['Une dague translucide, faite de sable figé.'],item:'t_dunes'},
 rencontre:{n:'Le marchand des sables',t:'x',who:'Marchand des sables',look:{skin:'#a8784a',hair:'#2a1a12',hs:0,col:'#c89a42',beard:1},i:['Marchand des sables|Objets rares, prix rares. Une seule affaire par voyageur.'],c:[['Acheter la Robe astrale (900 écus)','Marchand des sables|Excellent choix. Elle a vu passer trois mille nuits.',{g:-900,i:'rob3'}],['Acheter le Signet d’or (600 écus)','Marchand des sables|Il porte chance aux clans qui doutent.',{g:-600,i:'acc4'}],['Ne rien acheter','Marchand des sables|Une autre fois. Le sable revient toujours.',{x:10}]]}},
pont:{n:'Pont des Signets',bg:'plaine',map:'pont',light:'soir',poi:[
 ['pont1','Le poste de garde','Des gardes corrompus y prélèvent leur dîme.','c','',{i:['Garde|Taxe du crépuscule. Payez, ou passez par la rivière.'],e:'sol,sol,arc',o:'Le poste est vide. Les voyageurs passeront gratuitement ce soir.',r:{g:300}}],
 ['pont2','Les cadenas des amoureux','Des centaines de cadenas aux noms gravés.','x','',{i:['Des cadenas couvrent la rambarde. Sur l’un d’eux : « L. + course, pour toujours ».'],c:[['Ajouter le nom du clan','Un cadenas de plus, au nom de {clan}. Brann fait semblant de ne pas être ému.',{x:50}],['Lire les noms','Elio|Il y en a un pour chaque histoire. Même les courtes.',{g:60,i:'potion'}]]}],
 ['pont3','Le marchand de signets','Il fabrique les signets du pont.','l','Signetier Paulin',{i:['Signetier Paulin|Une plume d’aube, et je vous fais un signet qui ne se perd jamais.'],need:'plume*1',o:'Signetier Paulin|Voilà. Il retrouvera toujours votre page.',r:{i:'acc1',x:30}}],
 ['pont4','Sous l’arche','Des créatures s’abritent sous le pont.','c','',{i:['Sous l’arche, l’ombre grouille d’Encriers.'],e:'encre,encre,encre,feuillet',o:'L’arche résonne de nouveau du bruit de l’eau.',r:{g:260}}],
 ['pont5','Le péage des Juges','Un Juge exige un droit de passage.','x','Juge du pont',{i:['Juge du pont|Édit 212 : tout clan qui traverse doit 50 écus. Ou une bonne raison.'],c:[['Payer 50 écus','Juge du pont|Merci. Tenez, un reçu. Il vaut une potion à la caserne.',{g:-50,i:'hpotion'}],['Citer l’Édit 211','Juge du pont|… L’Édit 211 annule le 212 le soir. Vous connaissez vos lois. Passez.',{x:60}]]}],
 ['pont6','La statue du premier Juge','Elle tient une balance et un livre.','x','',{i:['Sur le socle : « Le premier Juge fut écrit pour protéger les enfants du livre. »'],c:[['Nettoyer la statue','Sous la mousse, le visage de la statue ressemble beaucoup à Aldric.',{x:60}],['Déposer une offrande (20 écus)','Une pièce dans la balance. Elle penche de votre côté.',{g:-20,i:'ether'}]]}],
 ['pont7','La barque échouée','Une barque bloquée par des Ratures.','c','',{i:['Une barque échouée contre une pile. Des Ratures la gribouillent.'],e:'rature,feuillet,feuillet',o:'La barque dérive librement. Un coffret y était caché.',r:{g:240,i:'remede*2'}}],
 ['pont8','Le musicien aveugle','Il joue du violon au milieu du pont.','l','Violoniste Hugo',{i:['Violoniste Hugo|Un Encrier m’a craché dans les yeux. Un remède, et je verrai de nouveau mes partitions.'],need:'remede*1',o:'Violoniste Hugo|Je vois ! Je vous joue la plus belle, celle du retour.',r:{x:60,g:120}}],
 ['pont9','La lanterne éteinte','La dernière lanterne du pont ne s’allume plus.','x','Allumeur Léon',{i:['Allumeur Léon|Sans elle, les voyageurs se perdent. Il faudrait une étincelle de mage.'],c:[['La rallumer','La flamme repart. Léon vous serre la main à vous la broyer.',{g:120,x:20}],['Lui prêter une baguette','Allumeur Léon|Je vous la rends demain. Tenez, en gage.',{i:'ether*2'}]]}],
 ['pont10','L’embuscade du crépuscule','Une bande attaque à la tombée du jour.','c','',{i:['Brann|Tu entends ? Plus rien. C’est jamais bon signe.'],e:'vol,vol,mno,sol',o:'L’embuscade a échoué. Le crépuscule redevient paisible.',r:{g:340,i:'hpotion'}}]
],
 tresor:{n:'Le signet du passeur',d:'Accroché sous la dernière arche.',i:['Un signet de cuir et d’argent, chaud comme une main.'],item:'t_pont'},
 rencontre:{n:'Bastien, le passeur muet',t:'recrue',who:'Bastien',job:'mbl',race:'kor',look:{skin:'#c99a78',hair:'#5a4a3a',hs:0,col:'#3f8f5a'},i:['Bastien ne parle pas. Il tend une ardoise : « Je soigne. Je voyage. Je vous suis ? »'],c:['L’accueillir','Sur l’ardoise : « Merci. » Puis, plus bas : « Brann parle pour deux. »']}},
port:{n:'Port-Virgule',bg:'cyrielle',map:'quai',light:'soir',poi:[
 ['port1','La capitainerie','Le maître de port tient le registre des navires.','x','Capitaine Maëlle',{i:['Capitaine Maëlle|Aucun navire n’est jamais revenu de l’Est. Ils s’arrêtent à la Dernière Page.'],c:[['Aider à tenir le registre','Capitaine Maëlle|Vous écrivez bien. Prenez ces écus, et revenez quand vous voulez.',{g:150}],['Demander la carte de l’Est','Capitaine Maëlle|Il n’y en a pas. Au-delà, c’est blanc. Prenez au moins ceci.',{i:'hpotion',x:20}]]}],
 ['port2','Les docks','Des dockers armés rackettent les pêcheurs.','c','',{i:['Docker|Le quai est à nous. Le poisson aussi.'],e:'sol,sol,vol,vol',o:'Les pêcheurs reprennent leurs étals.',r:{g:320}}],
 ['port3','Le marché aux poissons-plumes','Une poissonnière blessée.','l','Poissonnière Inès',{i:['Poissonnière Inès|Un poisson-plume m’a mordue. Une potion, et je reprends mon étal.'],need:'potion*1',o:'Poissonnière Inès|Merci. Prenez un poisson-plume séché, ça donne de l’entrain.',r:{i:'ether',g:80}}],
 ['port4','Le phare de Port-Virgule','Le même que celui de Brumeval.','x','',{i:['Rouge et blanc, avec une lampe qui tourne. Exactement celui de Brumeval.'],c:[['Monter en haut','D’en haut, on voit la Dernière Page, au loin. Elle brille comme une neige.',{x:80}],['Rester en bas','Elio|Je ne veux pas savoir s’il éclaire la même mer.',{i:'remede*2'}]]}],
 ['port5','La taverne du Point-Virgule','Un marin korr défie tout le monde au bras de fer.','x','Marin Gromm',{i:['Marin Gromm|Personne ne m’a jamais battu ! Celui qui gagne repart avec ma bourse.'],c:[['Envoyer Brann','Brann|Il a triché. Je le sais. Il a des cornes, c’est déloyal.',{x:40}],['Envoyer Elio','Marin Gromm|Tu as perdu, mais avec panache. Prends quand même ça.',{g:120}]]}],
 ['port6','L’entrepôt hanté','Des Ratures y gribouillent les caisses.','c','',{i:['Les caisses de l’entrepôt sont couvertes de gribouillis vivants.'],e:'rature,rature,encre,encre',o:'Les marchandises sont sauves.',r:{g:300,i:'potion*2'}}],
 ['port7','Le chantier naval','Un bateau qu’on n’arrive pas à finir.','l','Charpentière Yvette',{i:['Charpentière Yvette|Il manque 150 écus de bois pour finir la coque. Ce bateau ira plus loin que les autres.'],need:'g:150',o:'Charpentière Yvette|Il est fini. Je l’appelle « Fin ». C’est ironique. Tenez.',r:{i:'arm2',x:30}}],
 ['port8','La crique des contrebandiers','Ils trafiquent des pages volées.','c','',{i:['Dans la crique, des caisses de pages arrachées aux livres des villes.'],e:'vol,arc,arc,mno',o:'Les pages seront rendues à leurs livres.',r:{g:360,i:'ether'}}],
 ['port9','La maison du cartographe','Toutes ses cartes s’arrêtent au même endroit.','x','Cartographe Basile',{i:['Cartographe Basile|J’ai cartographié tout le royaume. Il fait onze jours de marche, d’un bout à l’autre.'],c:[['Acheter une carte (50 écus)','Cartographe Basile|Gardez-la. Un jour, elle vaudra cher : elle montrera un monde qui a existé.',{g:-50,x:80}],['Lui parler de Brumeval','Cartographe Basile|Brumeval… J’ai rêvé de ce nom. Prenez ça, pour le rêve.',{i:'plume'}]]}],
 ['port10','Le quai des départs','Des gens partent vers nulle part.','x','Voyageuse Clara',{i:['Voyageuse Clara|Je pars vers l’Est. On dit qu’au bout, il y a une autre histoire.'],c:[['La dissuader','Voyageuse Clara|Tu as peut-être raison. Je reste. Merci de m’avoir retenue.',{x:50}],['Lui souhaiter bon voyage','Voyageuse Clara|Si j’arrive quelque part, j’écrirai. Prends mes provisions.',{i:'potion*2,remede'}]]}]
],
 tresor:{n:'La cuirasse du port',d:'Au fond de l’épave du quai sud.',i:['Une cuirasse d’amiral, encore brillante sous les algues.'],item:'t_port'},
 rencontre:{n:'Ysolde, capitaine sans navire',t:'recrue',who:'Ysolde',job:'pal',race:'hum',look:{skin:'#e2b48c',hair:'#c8b070',hs:3,col:'#2b5a7a',fem:1},i:['Ysolde|Mon navire a sombré à la Dernière Page. Il me reste mon épée et mon honneur. Ils sont à vendre, si la cause est bonne.'],c:['L’engager','Ysolde|Votre cause est la meilleure : vous voulez rentrer. Moi aussi, un peu.']}},
marge:{n:'Cachot de la Marge',bg:'cachot',map:'cachot',light:'cachot',sansloi:1,poi:[
 ['marge1','La cellule 404','Un prisonnier qui ne sait plus pourquoi il est là.','x','Prisonnier 404',{i:['Prisonnier 404|On m’a enfermé pour une faute. Mais la page qui la décrivait a été arrachée.'],c:[['Le libérer','Prisonnier 404|Sans crime, pas de peine. C’est la seule loi qui marche ici. Merci.',{x:60}],['Lui laisser une potion','Prisonnier 404|Je resterai, au cas où on retrouve la page. Mais j’aurai moins froid.',{g:-0,i:'remede',x:20}]]}],
 ['marge2','Les oubliettes','Ce qu’on y jette ne remonte jamais.','c','',{i:['Au fond des oubliettes, quelque chose a été oublié… et ne l’a pas digéré.'],e:'golem,encre,encre',o:'Les oubliettes sont calmes. Pour l’instant.',r:{g:320}}],
 ['marge3','Le réfectoire','Les prisonniers ont faim.','l','Cuisinier Mathurin',{i:['Cuisinier Mathurin|Plus de vivres depuis trois semaines. Deux potions, et je fais une soupe pour tout le monde.'],need:'potion*2',o:'Cuisinier Mathurin|Une soupe à la potion. Infecte, mais elle tient chaud. Merci.',r:{g:150,x:40}}],
 ['marge4','La salle des Édits abolis','Les lois oubliées y sont archivées.','x','',{i:['Édit 1 : « Il est interdit de finir une histoire. » Barré à l’encre rouge.'],c:[['Lire les autres Édits','« Interdit d’oublier un enfant. » Celui-là n’a jamais été barré.',{x:70}],['Emporter un Édit','Un Édit plié, scellé. Il vaut cher chez les collectionneurs.',{g:180}]]}],
 ['marge5','Le geôlier repenti','Il a enfermé Brann sur ordre.','x','Geôlier Anselme',{i:['Geôlier Anselme|C’est moi qui ai fermé la cellule du feyrin. J’obéissais. Je ne dors plus.','Brann|Il me donnait sa part de fromage. En cachette.'],c:[['Lui pardonner','Geôlier Anselme|Merci. Je quitte la Marge ce soir. Prenez mes clés.',{x:60,i:'acc2'}],['Lui demander réparation','Geôlier Anselme|C’est juste. Voilà toutes mes économies.',{g:250}]]}],
 ['marge6','Le couloir sans fin','Il se redessine à mesure qu’on avance.','c','',{i:['Le couloir se griffonne devant vous. Trois Ratures en sont l’auteur.'],e:'rature,rature,rature',o:'Le couloir a enfin une fin.',r:{g:340,i:'ether'}}],
 ['marge7','L’armurerie','Des gardes y protègent l’arsenal.','c','',{i:['Garde|Personne ne touche aux armes du Cachot !'],e:'sol,sol,arc',o:'L’armurerie est à vous. Quelques lames sont encore bonnes.',r:{g:200,i:'epee2'}}],
 ['marge8','La cellule de Brann','Ses griffures sont encore sur le mur.','x','',{i:['Gravé dans le mur, d’une écriture penchée : « Jour 3. Fromage : 0. Moral : bas. Elio : viendra. »'],c:[['Ajouter une ligne','Elio grave : « Jour 4. Elio est venu. » Brann regarde ailleurs très fort.',{x:60}],['Montrer le mur à Brann','Brann|J’ai toujours su que tu viendrais. J’avais juste faim.',{i:'potion*2'}]]}],
 ['marge9','Le puits des ratures','Des mots effacés y tombent.','l','Gardienne Ophélie',{i:['Gardienne Ophélie|Je trie les mots effacés. Un éther me permettrait de lire les plus pâles.'],need:'ether*1',o:'Gardienne Ophélie|J’ai retrouvé « espoir ». Il était tout au fond. Prenez ceci.',r:{i:'hpotion*2',x:30}}],
 ['marge10','La porte du bas de page','Elle mène plus loin que la Marge.','c','',{i:['La porte s’ouvre sur du blanc. Un Golem et une Rature en sortent.'],e:'golem+1,rature',o:'La porte se referme. Pour de bon, cette fois.',r:{g:400,i:'hpotion'}}]
],
 tresor:{n:'La lame sans nom',d:'Dans une cellule murée.',i:['Une épée sans inscription, comme si son histoire n’avait jamais été écrite.'],item:'t_marge'},
 rencontre:{n:'Le Golem sans titre',t:'rare',d:'Un Golem fait de livres jamais publiés.',e:'golem+2,golem,encre',i:['Les murs tremblent. Un Golem immense, fait de manuscrits refusés, se lève.'],r:{g:500,i:'arm3'}}},
foret:{n:'Forêt des Ratures',bg:'foret',map:'foret',light:'foret',poi:[
 ['foret1','L’arbre barré','Un chêne qu’on est en train d’effacer.','x','Vieux Chêne',{i:['Vieux Chêne|Je m’appelais « chêne ». On m’a barré. Je ne sais plus ce que je suis.'],c:[['Réécrire son nom','Vieux Chêne|Chêne. Oui. C’est ça. Merci, petit scribe.',{x:70}],['L’appeler « Grand Barré »','Vieux Chêne|Grand Barré… J’aime bien. C’est un nom qui a vécu. Prends mes glands d’or.',{g:200}]]}],
 ['foret2','La clairière des Feuillets','Ils y tourbillonnent en nuée.','c','',{i:['Des centaines de Feuillets tournoient. Quatre plongent sur vous.'],e:'feuillet,feuillet,feuillet,feuillet',o:'La nuée se disperse en pages calmes.',r:{g:280}}],
 ['foret3','La hutte de Margot','Une sorcière prépare une potion.','l','Sorcière Margot',{i:['Sorcière Margot|Mon chaudron manque de deux éthers. En échange, une recette de famille.'],need:'ether*2',o:'Sorcière Margot|Parfait. Voici trois maxi-potions, et ne demandez pas ce qu’il y a dedans.',r:{i:'hpotion*3',x:20}}],
 ['foret4','Le ruisseau d’encre','Il charrie des Encriers.','c','',{i:['Le ruisseau coule à l’envers. Des Encriers remontent le courant.'],e:'encre,encre,encre,rature',o:'Le ruisseau redescend dans le bon sens.',r:{g:300,i:'potion'}}],
 ['foret5','Les champignons-virgules','Ils poussent en cercle.','x','',{i:['Des champignons en forme de virgule. Ils sentent la réglisse.'],c:[['En goûter un','Tout le monde parle en phrases plus longues pendant une heure. C’est épuisant, mais instructif.',{x:60}],['En cueillir pour Pim','Pim|Des virgulines ! Je vais en faire des potions de pause.',{i:'ether*2'}]]}],
 ['foret6','Le campement des Foulées','Lina y avait laissé ses affaires.','x','',{i:['Un sac usé. Dedans : une paire de chaussures de course, et une béquille pliée.'],c:[['Garder la béquille pour Lina','Elio|Elle n’en aura peut-être plus besoin. Ou peut-être que si. C’est à elle de décider.',{x:70}],['Laisser le sac','Brann|Elle reviendra le chercher. Les gens reviennent toujours chercher ce genre de sac.',{i:'acc1'}]]}],
 ['foret7','Le cœur raturé','Le centre de la forêt.','c','',{i:['Au cœur de la forêt, les arbres sont si barrés qu’ils en deviennent noirs.'],e:'rature,rature,golem',o:'Quelques bourgeons repoussent, en lettres claires.',r:{g:360,i:'hpotion'}}],
 ['foret8','Le chasseur égaré','Il tourne en rond depuis des jours.','l','Chasseur Firmin',{i:['Chasseur Firmin|Je tourne en rond. Deux potions, et je retrouverai mes forces et le chemin.'],need:'potion*2',o:'Chasseur Firmin|Le chemin ! Merci. Prenez mon arc de rechange.',r:{i:'arc2',x:20}}],
 ['foret9','Le cercle de pierres','Des menhirs qui murmurent.','x','',{i:['Les pierres murmurent les noms de ceux qui ont lu le livre avant vous. Il y en a beaucoup.'],c:[['Écouter les noms','Parmi eux : « Aldric ». Il y a très longtemps.',{x:80}],['Ajouter le sien','Elio grave son nom. Les pierres se taisent, respectueuses.',{g:120,x:20}]]}],
 ['foret10','Le terrier du loup-plume','Un loup de papier défend ses petits.','c','',{i:['Un grognement. Des Feuillets en forme de loups surgissent des fougères.'],e:'feuillet+1,feuillet+1,rature',o:'Les loups-plumes reculent dans leur terrier. On les laisse tranquilles.',r:{g:320}}]
],
 tresor:{n:'La plume-rature',d:'Au pied du Vieux Chêne.',i:['Une baguette taillée dans une rature figée. Elle écrit et efface à la fois.'],item:'t_foret'},
 rencontre:{n:'La Rature-Mère',t:'rare',d:'Celle qui donne naissance à toutes les autres.',e:'rature+2,rature,rature',i:['Une Rature immense se déploie. Les autres se pressent autour d’elle.'],r:{g:550,i:'bag4'}}},
palais:{n:'Palais des Mille Pages',bg:'palais',map:'palais',light:'palais',poi:[
 ['palais1','La salle du trône vide','Personne ne s’y assoit plus.','x','',{i:['Le trône est vide. Une couronne de papier repose sur l’accoudoir.'],c:[['S’asseoir sur le trône','Elio|C’est inconfortable. Je comprends pourquoi Sacha restait debout.',{x:60}],['Emporter la couronne','Brann|Elle te va mal. Elle va mal à tout le monde, c’est son principe.',{g:250}]]}],
 ['palais2','La bibliothèque royale','Le bibliothécaire manque de plumes.','l','Bibliothécaire Ernest',{i:['Bibliothécaire Ernest|Les registres doivent être recopiés. Une plume d’aube écrirait à ma place pendant que je dors.'],need:'plume*1',o:'Bibliothécaire Ernest|Elle écrit déjà. Voici une robe d’érudit, je n’en ai plus l’usage.',r:{i:'rob2',x:30}}],
 ['palais3','Les cuisines','Des Braséoles ont pris les fourneaux.','c','',{i:['Les fourneaux crachent des flammes vivantes.'],e:'braise,braise,braise,braise',o:'Le chef vous offre un plat brûlé. C’est l’intention qui compte.',r:{g:300}}],
 ['palais4','La galerie des portraits','Des générations de Juges.','x','',{i:['Le dernier portrait est celui d’Aldric. Le cadre suivant est vide, avec une plaque : « Sacha ? »'],c:[['Retirer la plaque','Elio|Il n’a pas à devenir Juge. Il a le droit d’être juste petit-fils.',{x:80}],['La laisser','Brann|Laisse-lui le choix. C’est ça, grandir.',{i:'ether*2'}]]}],
 ['palais5','La garde rouge','Les derniers fidèles du Prince Scribe.','c','',{i:['Capitaine rouge|Le Prince est parti. Nous gardons quand même le palais.'],e:'pal,sol,sol',o:'Capitaine rouge|Vous avez gagné. Gardez le palais, alors. Il est trop grand pour nous.',r:{g:380,i:'hpotion'}}],
 ['palais6','Le jardin suspendu','Des fleurs de papier qui sentent vraiment.','x','Jardinière Rosalie',{i:['Jardinière Rosalie|Ces fleurs ne fanent jamais. C’est leur malédiction.'],c:[['En cueillir une','Jardinière Rosalie|Prenez-la. Une fleur qui ne fane pas, il faut l’offrir à quelqu’un qui part.',{i:'plume'}],['Les arroser','Jardinière Rosalie|Personne ne les arrose jamais, puisqu’elles ne meurent pas. Merci.',{x:60}]]}],
 ['palais7','La chambre de Sacha','Un journal intime sur le lit.','x','',{i:['Journal de Sacha : « Grand-père m’a appelé par mon prénom trois fois aujourd’hui. Je les ai comptées. »'],c:[['Lire la suite','« Je sais que ce n’est pas lui. Mais j’ai le droit d’avoir un bon jour. »',{x:80}],['Refermer le journal','Elio|Il nous le racontera lui-même, un jour.',{g:100,i:'remede'}]]}],
 ['palais8','Les archives des Édits','Des mages gardent les textes de loi.','c','',{i:['Archiviste|Ces archives sont interdites aux clans hors-la-loi. C’est-à-dire à vous.'],e:'mno,mno,sol',o:'Les archives sont ouvertes. Certaines lois font froid dans le dos.',r:{g:340,i:'ether*2'}}],
 ['palais9','Le scriptorium','Les scribes recopient les Édits à la main.','l','Scribe Anatole',{i:['Scribe Anatole|Mes yeux faiblissent. Un éther, et je finirai la copie du jour.'],need:'ether*1',o:'Scribe Anatole|Fini. Je vous recopie une page de chance, pour vous.',r:{g:200,x:40}}],
 ['palais10','Les toits du palais','Des voleurs y guettent les fenêtres.','c','',{i:['Sur les toits, des silhouettes. Des voleurs, et des archers pour les couvrir.'],e:'arc,arc,vol,vol',o:'Les toits sont libres. D’ici, on voit tout le royaume.',r:{g:380}}]
],
 tresor:{n:'Le sceptre du Scribe',d:'Caché derrière le trône.',i:['Le sceptre de Sacha, oublié derrière le trône. Il porte encore une tache d’encre.'],item:'t_palais'},
 rencontre:{n:'Le bibliothécaire du soir',t:'x',who:'Bibliothécaire du soir',look:{skin:'#eac4a2',hair:'#3a2a1a',hs:3,col:'#1f2a52'},i:['Bibliothécaire du soir|Je range les livres que personne n’a lus. Il y en a un pour vous.'],c:[['Prendre le livre','Le livre s’intitule « Brumeval ». Il ne contient qu’une page, encore blanche.',{x:120,i:'ether*2'}],['Le laisser','Bibliothécaire du soir|Sage. On ne lit pas sa propre histoire avant la fin.',{i:'acc4'}]]}},
fin:{n:'La Dernière Page',bg:'finpage',map:'fin',light:'fin',sansloi:1,poi:[
 ['fin1','La marge blanche','Il n’y a rien d’écrit. Nulle part.','x','',{i:['Le blanc s’étend dans toutes les directions. Le silence aussi.'],c:[['Y écrire quelque chose','Elio écrit « ici ». Un petit morceau de sol apparaît sous ses pieds.',{x:100}],['Rester silencieux','Brann|Même moi, je me tais. Note-le, c’est historique.',{i:'ether*2'}]]}],
 ['fin2','Les mots tombés','Des Ratures ramassent les mots qui tombent du livre.','c','',{i:['Les mots tombent comme de la neige. Des Ratures les dévorent.'],e:'rature,rature,rature',o:'Quelques mots sont sauvés : « clan », « fromage », « demain ».',r:{g:400}}],
 ['fin3','Le dernier lecteur','Un vieil homme lit, assis dans le blanc.','x','Le dernier lecteur',{i:['Le dernier lecteur|J’arrive à la fin. Je ralentis. Je ne veux pas qu’elle arrive.'],c:[['Lire avec lui','Vous lisez ensemble la dernière ligne. Il sourit, et disparaît, apaisé.',{x:120}],['Lui conseiller de relire','Le dernier lecteur|Relire… Oui. Recommencer, ce n’est pas reculer. Merci.',{i:'hpotion*2'}]]}],
 ['fin4','La pile d’histoires abandonnées','Des récits sans fin.','l','Gardienne des fins',{i:['Gardienne des fins|Toutes ces histoires attendent leur dernier mot. Une plume d’aube en finirait une.'],need:'plume*1',o:'Gardienne des fins|Une fin heureuse. C’est rare, ici. Merci.',r:{g:300,x:80}}],
 ['fin5','Le reflet de Brumeval','Une flaque où l’on voit la ville.','x','',{i:['Dans la flaque, Brumeval sous la neige arrêtée. La fenêtre de la mère d’Elio est allumée.'],c:[['Toucher la surface','Une ride parcourt l’image. Là-bas, une seconde, un flocon bouge.',{x:120}],['Regarder longtemps','Elio|Attends-moi. J’arrive.',{i:'ether*2'}]]}],
 ['fin6','La page déchirée','Un Golem y garde le morceau arraché.','c','',{i:['Un Golem tient un morceau de page arrachée. Deux Ratures l’escortent.'],e:'golem+1,rature,rature',o:'Sur le morceau : « …et il ne fut jamais seul ».',r:{g:450}}],
 ['fin7','L’encrier originel','D’où vient toute l’encre du monde.','c','',{i:['Un encrier géant. Quatre Encriers en sortent, encore humides.'],e:'encre+1,encre+1,encre,encre',o:'L’encrier est vide. Pour la première fois.',r:{g:400,i:'ether*2'}}],
 ['fin8','Le banc de Brann','Un banc au bord du monde, à sa taille.','x','',{i:['Un banc. Gravé dessus : « Pour savourer la dernière page. Fromage bienvenu. — B. »'],c:[['S’y asseoir','Elio s’assoit. La vue est magnifique. On comprend pourquoi il l’aimait.',{x:100}],['Y laisser une potion','Pour le prochain qui passera. Un clan, ça se disperse.',{i:'acc3'}]]}],
 ['fin9','La signature','Le livre demande qu’on le signe.','x','',{i:['Au milieu du blanc, une ligne pointillée : « Signature de l’auteur ».'],c:[['Signer « Elio »','Le nom reste. Il ne s’efface pas. Le livre a un auteur, maintenant.',{x:150}],['Signer « {clan} »','Tous les noms du clan apparaissent un à un sous la ligne.',{g:300,x:60}]]}],
 ['fin10','L’ombre d’Oméga','Ce qui reste du livre qui voulait tout écrire.','c','',{i:['Une ombre de couverture se dresse. Elle a encore une page à défendre.'],e:'omega-3,rature,rature',o:'L’ombre se referme doucement, comme on ferme un livre aimé.',r:{g:600,i:'hpotion*2'}}]
],

  for(const k of['hp','mp','atk','def','mag','res','spd'])s[k]=J.b[k]+J.g[k]*(u.lvl-1)+(R[k]||0);
  s.mov=J.mov;s.jmp=J.jmp;
  for(const sl of['w','a','c']){const it=IT[u.eq[sl]];if(!it)continue;for(const k of['hp','mp','atk','def','mag','res','spd','mov'])if(it[k])s[k]+=it[k];}
  for(const k in s)s[k]=Math.max(1,Math.round(s[k]));return s;}
function canEquip(u,id){const it=IT[id],J=JOBS[u.job];if(!it)return false;if(it.k==='w')return J.wt.includes(it.wt);if(it.k==='a')return J.at.includes(it.at);return it.k==='c';}
function taught(u,a){for(const sl of['w','a','c']){const it=IT[u.eq[sl]];if(it&&it.teach&&it.teach.includes(a))return true;}return false;}
function usableAb(u){const out=[];for(const a of JOBS[u.job].ab){if(AB[a].t==='react')continue;if(u.mast[a]||taught(u,a))out.push(a);}
  if(u.sec&&u.sec!==u.job&&JOBS[u.sec])for(const a of JOBS[u.sec].ab){if(AB[a].t!=='react'&&u.mast[a])out.push(a);}
  for(const sl of['w','a','c']){const it=IT[u.eq[sl]];if(it&&it.grant)for(const a of it.grant)if(!out.includes(a))out.push(a);}return out;}
function hasReact(u){return !!(u.mast.contre||(u.job==='sol'&&taught(u,'contre')));}
function mastCount(u,j){return JOBS[j].ab.filter(a=>u.mast[a]).length;}
function jobOk(u,j){const r=JOBS[j].req;return !r||mastCount(u,r[0])>=r[1];}
function invAdd(id,n){GS.inv[id]=(GS.inv[id]||0)+(n||1);if(GS.inv[id]<=0)delete GS.inv[id];}
function equip(u,sl,id){if(u.eq[sl])invAdd(u.eq[sl],1);u.eq[sl]=null;if(id){invAdd(id,-1);u.eq[sl]=id;}}
function bestInv(u,k){let best=null;for(const id in GS.inv){const it=IT[id];if(GS.inv[id]>0&&it.k===k&&canEquip(u,id)&&(!best||it.px>IT[best].px))best=id;}return best;}
function setJob(u,j){u.job=j;if(u.sec===j)u.sec=null;for(const sl of['w','a']){if(u.eq[sl]&&!canEquip(u,u.eq[sl]))equip(u,sl,null);if(!u.eq[sl]){const b=bestInv(u,sl);if(b)equip(u,sl,b);}}}
function genLook(job,race,enemy){const skins={hum:['#f2c9a0','#d9a070','#f6d9c0','#b98560'],fey:['#e89a4c','#d98a3c','#c9c2b8'],syl:['#f0d8b8','#dfe8c8'],kor:['#c99a78','#a98a70']}[race];
  const hairs=['#6b3f1d','#1c1a24','#e6d08a','#c2412d','#58a85c','#4a78d0','#9a9aa6','#8a4ab0'];
  const cols=enemy?{sol:'#8a3a3a',arc:'#7a5a2a',vol:'#4a4654',mbl:'#b9b0a0',mno:'#5a2a4a',pal:'#6a2a2a'}:{sol:'#3a6fd8',arc:'#2f7f8f',vol:'#5b4a6a',mbl:'#f2f2f2',mno:'#6a3aa0',pal:'#3a6fd8'};
  const L={skin:pick(skins),hair:pick(hairs),hs:(Math.random()*4)|0,col:cols[job]||'#3a6fd8',race,job};if(enemy)L.enemy=true;if(Math.random()<.4)L.fem=1;return L;}
const NOMS=['Aubin','Cléa','Faustin','Gaëlle','Hector','Isaure','Jorian','Liv','Maël','Nour','Oriane','Perrin','Quitterie','Rémi','Solène','Thaïs','Ulric','Vanina','Yann','Zélie','Bastien','Capucine','Dorian','Élise'];

/* ===== SAUVEGARDE LOCALE (hors ligne) =====
   Chaque sauvegarde est écrite en double : localStorage et IndexedDB (la plus récente gagne au chargement).
   Si le mode de lancement n'offre aucun stockage (aperçu de fichier, cadre isolé…), la partie reste en mémoire
   et l'export / import d'un fichier .json garde la progression. 4 emplacements : automatique + 3 manuels. */
const SAVE_KEY='heavenOmega_save_v1',SV_PRE='heavenOmega_slot_',SLOTS=['auto','s1','s2','s3'];
const SLOT_N={auto:'Sauvegarde automatique',s1:'Emplacement 1',s2:'Emplacement 2',s3:'Emplacement 3'};
const STORE={ls:false,idb:null,cache:{},ready:false,warned:false};
function lsOK(){try{const k='__ho_test';localStorage.setItem(k,'1');const ok=localStorage.getItem(k)==='1';localStorage.removeItem(k);return ok;}catch(_){return false;}}
function idbOpen(){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v);}};setTimeout(()=>fin(null),1500);
  try{if(!window.indexedDB)return fin(null);const r=indexedDB.open('heavenOmega',1);r.onupgradeneeded=()=>{try{r.result.createObjectStore('saves');}catch(_){}};r.onsuccess=()=>fin(r.result);r.onerror=()=>fin(null);r.onblocked=()=>fin(null);}catch(_){fin(null);}});}
function idbAll(db){return new Promise(res=>{try{const out={},rq=db.transaction('saves','readonly').objectStore('saves').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};rq.onerror=()=>res({});}catch(_){res({});}});}
function idbPut(k,v,lsOk){if(!STORE.idb)return false;try{const tx=STORE.idb.transaction('saves','readwrite'),st=tx.objectStore('saves');
    tx.onabort=tx.onerror=()=>{if(!lsOk)svFail(quotaErr(tx.error)?'quota':'err');};if(v==null)st.delete(k);else st.put(v,k);return true;}catch(e){return false;}}
/* Format des sauvegardes : 1 = v2.5 d'origine (sans champ fmt), 2 = données validées/migrées à la lecture. */
const SAVE_FMT=2;
const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
const quotaErr=e=>!!e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014);
/* Valide et complète une partie lue (ancienne version, fichier importé, donnée abîmée). Renvoie une copie sûre, ou null si inutilisable. */
function migrateData(g0){try{if(!isObj(g0)||!Array.isArray(g0.party)||!g0.party.length)return null;
  const g=JSON.parse(JSON.stringify(g0)),num=(v,d)=>typeof v==='number'&&isFinite(v)?v:d,obj=v=>isObj(v)?v:{},arr=v=>Array.isArray(v)?v:[];
  for(const u of g.party)if(!isObj(u)||typeof u.id!=='string'||!JOBS[u.job])return null;
  g.clan=typeof g.clan==='string'&&g.clan?g.clan:'Aurore';g.gil=Math.max(0,num(g.gil,0));g.story=Math.max(0,num(g.story,0));
  const inv={};for(const k of Object.keys(obj(g.inv)))if(IT[k]&&num(g.inv[k],0)>0)inv[k]=g.inv[k];g.inv=inv;
  g.done=obj(g.done);g.vu=obj(g.vu);g.prison=arr(g.prison);if(g.absent!=null)g.absent=arr(g.absent);
  if(g.accepted==null||!MIS[g.accepted])g.accepted=null;
  if(!NODES[g.node])g.node='cyr';g.nodes=arr(g.nodes).filter(n=>NODES[n]);
  const zq=obj(g.zq);g.zq=Object.assign(zq,{done:obj(zq.done),tres:obj(zq.tres),enc:obj(zq.enc),ann:obj(zq.ann)});
  let mx=0;for(const u of g.party){if(!RACES[u.race])u.race='hum';u.lvl=Math.max(1,num(u.lvl,1));u.exp=num(u.exp,0);
    const eq=obj(u.eq);u.eq=Object.assign(eq,{w:IT[eq.w]?eq.w:null,a:IT[eq.a]?eq.a:null,c:IT[eq.c]?eq.c:null});
    u.ap=obj(u.ap);u.mast=obj(u.mast);if(u.sec!=null&&!JOBS[u.sec])u.sec=null;if(typeof u.name!=='string')u.name='?';
    const m=/^u(\d+)$/.exec(u.id);if(m)mx=Math.max(mx,+m[1]);}
  g.uid=Math.max(num(g.uid,1),mx+1);g.fini=!!g.fini;g.v=VERSION;return g;}catch(_){return null;}}
/* Enregistrement d'emplacement validé (données migrées), ou null. newer : écrit par une version plus récente du jeu. */
function recOf(r){if(!isObj(r))return null;const g=migrateData(r.data);if(!g)return null;
  const o=mkRec(g,typeof r.t==='number'&&isFinite(r.t)?r.t:0);if((+r.fmt||1)>SAVE_FMT||r.newer)o.newer=1;return o;}
const okRec=r=>!!recOf(r);
async function storeInit(){STORE.ls=lsOK();STORE.idb=await idbOpen();const A={};
  if(STORE.ls){for(const s of SLOTS){try{const r=localStorage.getItem(SV_PRE+s);if(r)A[s]=JSON.parse(r);}catch(_){}}
    try{const old=localStorage.getItem(SAVE_KEY);if(old&&!A.auto){const g=JSON.parse(old);if(g&&g.party)A.auto=mkRec(g,0);}}catch(_){}}
  const D=STORE.idb?await idbAll(STORE.idb):{};
  STORE.bad=[];for(const s of SLOTS){const a=recOf(A[s]),b=recOf(D[s]);const r=a&&b?(a.t>=b.t?a:b):(a||b);if(r)STORE.cache[s]=r;else if(A[s]!==undefined||D[s]!==undefined||(STORE.ls&&(()=>{try{return localStorage.getItem(SV_PRE+s)!=null;}catch(_){return false;}})()))STORE.bad.push(s);}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(_){}
  STORE.ready=true;}
function storeMode(){return STORE.ls||STORE.idb?'local':'mem';}
const chapOf=st=>Math.min(5,[1,1,2,2,3,3,4,4,4,5][Math.min(9,st||0)]);
function mkRec(g,t){const p=g.party||[],lv=p.length?Math.round(p.reduce((s,u)=>s+u.lvl,0)/p.length):1;return{v:VERSION,fmt:SAVE_FMT,t:t==null?Date.now():t,clan:g.clan,story:g.story,lvl:lv,n:p.length,node:g.node,fini:!!g.fini,data:g};}
function writeSlot(s,rec){STORE.cache[s]=rec;let ok=false,err=null;const txt=JSON.stringify(rec);
  if(STORE.ls){try{localStorage.setItem(SV_PRE+s,txt);ok=true;}catch(e){err=quotaErr(e)?'quota':'err';}}
  if(STORE.idb&&idbPut(s,JSON.parse(txt),ok))ok=true;STORE.err=ok?null:(err||(storeMode()==='mem'?'mem':'err'));return ok;}
function saveGame(slot){if(!GS)return false;let ok=false;try{ok=writeSlot(slot||'auto',mkRec(JSON.parse(JSON.stringify(GS))));}catch(_){STORE.err='err';}
  if(!ok)svFail(STORE.err);return ok;}
function svFail(why){if(why==='mem'){if(STORE.warned)return;STORE.warned=true;}else{const n=Date.now();if(STORE.failT&&n-STORE.failT<60000)return;STORE.failT=n;}
  setTimeout(()=>toast(why==='mem'?'Ce mode de lancement ne garde pas les données : exportez votre partie (bouton Sauvegarder).':why==='quota'?'Stockage plein : la sauvegarde a échoué. Exportez votre partie depuis « Sauvegardes ».':'La sauvegarde a échoué sur cet appareil. Exportez votre partie depuis « Sauvegardes ».',5200),700);}
function latestSlot(){let b=null;for(const s in STORE.cache)if(!b||STORE.cache[s].t>STORE.cache[b].t)b=s;return b;}
function useData(g){const d=migrateData(g);if(!d)throw new Error('sauvegarde illisible');GS=d;}
function loadGame(slot){const order=slot?[slot]:SLOTS.filter(s=>STORE.cache[s]).sort((a,b)=>STORE.cache[b].t-STORE.cache[a].t);
  for(const s of order){const r=recOf(STORE.cache[s]);if(!r)continue;try{useData(r.data);}catch(_){continue;}
    if(r.newer)setTimeout(()=>toast('Sauvegarde créée par une version plus récente du jeu : certains éléments peuvent manquer.',4200),600);return true;}return false;}
function hasSave(){return !!latestSlot();}
function recInfo(r){const d=new Date(r.t);return 'Clan '+esc(r.clan||'?')+' · chapitre '+chapOf(r.story)+(r.fini?' (terminé)':'')+' · niveau moyen '+r.lvl+' · '+r.n+' membres'+(NODES[r.node]?' · '+esc(NODES[r.node].n):'')+(r.t?'<br>'+d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'');}
/* --- fichier : export / import --- */
function exportSave(rec){const txt=JSON.stringify(Object.assign({jeu:'Heaven Omega',studio:'F.S.M Game House',format:1},rec));
  const nm='HeavenOmega_'+String(rec.clan||'clan').replace(/[^A-Za-z0-9À-ÿ_-]+/g,'')+'_'+new Date(rec.t||Date.now()).toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
  const blob=new Blob([txt],{type:'application/json'});
  try{const f=new File([blob],nm,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Sauvegarde Heaven Omega'}).then(()=>toast('Sauvegarde exportée.')).catch(e=>{if(!e||e.name!=='AbortError')exportText(txt);});return;}}catch(_){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},5000);toast('Fichier « '+nm+' » enregistré dans vos téléchargements.',4200);}
  catch(_){exportText(txt);}}
function exportText(txt){showScr('<div class="pan" style="width:min(560px,100%)"><div class="tt"><h2>Code de sauvegarde</h2></div><div class="cc"><p class="note">Le fichier n’a pas pu être créé dans ce mode de lancement. Copiez ce texte et gardez-le (Notes, Fichiers…) : « Coller un code » le rechargera.</p><textarea id="svTxt" class="champ code" readonly>'+esc(txt)+'</textarea></div><div class="pied"><button class="bt pl" data-a="svCopy">Copier</button><button class="bt or" data-a="svBackP">Fermer</button></div></div>');}
ACT.svCopy=()=>{const t=$('#svTxt');if(!t)return;t.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Code copié.')).catch(()=>{if(!ok)toast('Sélectionnez le texte et copiez-le.');});else toast(ok?'Code copié.':'Sélectionnez le texte et copiez-le.');};
function parseSave(txt){try{const o=JSON.parse(String(txt).trim());const g=o&&o.data&&o.data.party?o.data:o&&o.party?o:null;if(!g||!Array.isArray(g.party)||!g.party.length||!g.party[0].job)return null;return migrateData(g);}catch(_){return null;}}
let svPending=null;
function importAsk(g){svPending=g;const r=mkRec(g);showScr('<div class="pan" style="width:min(480px,100%)"><div class="tt"><h2>Charger cette partie ?</h2></div><div class="cc"><p class="note">'+recInfo(Object.assign(r,{t:0}))+'</p><p class="note">Elle remplacera la sauvegarde automatique'+(GS?' et la partie en cours':'')+'.</p></div><div class="pied"><button class="bt pl" data-a="svBackP">Annuler</button><button class="bt or" data-a="svImpOk">Charger</button></div></div>');}
ACT.svImpOk=()=>{if(!svPending)return;useData(svPending);svPending=null;saveGame('auto');hideScr();svBack=null;toast('Partie importée.');fadeTo(1,300).then(()=>showWorld());};
ACT.svImp=()=>{const inp=$('#svFile');inp.value='';inp.click();};
$('#svFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const g=parseSave(rd.result);if(!g){toast('Ce fichier n’est pas une sauvegarde Heaven Omega.',3600);return;}importAsk(g);};rd.onerror=()=>toast('Lecture du fichier impossible.');rd.readAsText(f);});
ACT.svPaste=()=>showScr('<div class="pan" style="width:min(560px,100%)"><div class="tt"><h2>Coller un code</h2></div><div class="cc"><p class="note">Collez ici le code de sauvegarde (contenu d’un fichier .json exporté).</p><textarea id="svIn" class="champ code"></textarea></div><div class="pied"><button class="bt pl" data-a="svBackP">Annuler</button><button class="bt or" data-a="svPasteOk">Valider</button></div></div>');
ACT.svPasteOk=()=>{const g=parseSave(($('#svIn')||{}).value||'');if(!g){toast('Code de sauvegarde illisible.',3200);return;}importAsk(g);};
/* --- écran des sauvegardes --- */
let svMode='load',svBack=null;
function showSaves(mode,back){if(mode)svMode=mode;if(back)svBack=back;const local=storeMode()==='local';
  let h='<div class="pan" style="width:min(620px,100%)"><div class="tt"><h2>Sauvegardes</h2><button class="bt sm or" data-a="svX">Fermer</button></div><div class="cc">';
  h+=local?'<p class="note">Les parties sont gardées sur cet appareil, même hors ligne. Exportez un fichier pour les copier ailleurs ou les mettre à l’abri.</p>':'<p class="note avert">Ce mode de lancement ne garde aucune donnée entre deux ouvertures. Exportez votre partie dans un fichier avant de quitter, puis importez-la au prochain lancement.</p>';
  for(const s of SLOTS){const r=STORE.cache[s];h+='<div class="li"><div class="g"><b>'+SLOT_N[s]+'</b>'+(s==='auto'?' <span class="tag">auto</span>':'')+'<p>'+(r?recInfo(r):'Vide')+'</p></div><div class="row" style="justify-content:flex-end">';
    if(svMode==='save'&&s!=='auto')h+='<button class="bt sm'+(r?' pl':'')+'" data-a="svSave" data-v="'+s+'">'+(r?'Écraser':'Sauvegarder ici')+'</button>';
    if(r)h+='<button class="bt sm pl" data-a="svExp" data-v="'+s+'">Exporter</button><button class="bt sm or" data-a="svLoad" data-v="'+s+'">Charger</button>';
    h+='</div></div>';}
  h+='<div class="sec">Fichier</div><div class="row">'+(GS&&svMode==='save'?'<button class="bt" data-a="svExpCur">Exporter la partie en cours</button>':'')+'<button class="bt" data-a="svImp">Importer un fichier</button><button class="bt pl" data-a="svPaste">Coller un code</button></div>';
  showScr(h+'</div></div>');}
ACT.svX=()=>{const f=svBack;if(f)f();else hideScr();};
ACT.svSave=v=>{const ok=saveGame(v);saveGame('auto');toast(ok?SLOT_N[v]+' : partie sauvegardée.':STORE.err==='quota'?'Stockage plein : sauvegarde impossible, exportez la partie.':'Partie gardée en mémoire seulement : exportez-la.',3200);showSaves();};
ACT.svExp=v=>{const r=STORE.cache[v];if(r)exportSave(r);};
ACT.svExpCur=()=>{saveGame('auto');exportSave(mkRec(JSON.parse(JSON.stringify(GS))));};
ACT.svLoad=v=>{const r=STORE.cache[v];if(!r)return;const go=()=>{if(!loadGame(v)){toast('Sauvegarde illisible.');return;}hideScr();svBack=null;fadeTo(1,300).then(()=>showWorld('Partie chargée : '+SLOT_N[v]+'.'));};
  if(GS&&svMode==='save')showScr('<div class="pan" style="width:min(440px,100%)"><div class="tt"><h2>Charger ?</h2></div><div class="cc"><p class="note">La progression depuis la dernière sauvegarde de la partie en cours sera perdue.</p></div><div class="pied"><button class="bt pl" data-a="svBackP">Annuler</button><button class="bt or" data-a="svLoadOk" data-v="'+v+'">Charger</button></div></div>');else go();};
ACT.svLoadOk=v=>{if(!loadGame(v)){toast('Sauvegarde illisible.');return;}hideScr();svBack=null;fadeTo(1,300).then(()=>showWorld('Partie chargée : '+SLOT_N[v]+'.'));};
ACT.svBackP=()=>showSaves();

/* ===== DESSIN : personnages, monstres, tuiles, décors ===== */
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;if(f<=1){r*=f;g*=f;b*=f;}else{r+=(255-r)*(f-1);g+=(255-g)*(f-1);b+=(255-b)*(f-1);}return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function fs(c,f){c.fillStyle=f;c.fill();c.stroke();}
function poly(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
const OUT='#2b2236';
function lookOf(o){if(!o)return CH.elio;if(typeof o==='string')return CH[o]||{mon:o};if(o.skin||o.mon)return o;if(o.L)return o.L;const b=o.ch?CH[o.ch]:o.look;const L=Object.assign({},b,o.app||{},{job:o.job});if(o.eq){L.wid=o.eq.w||null;L.aid=o.eq.a||null;L.cid=o.eq.c||null;}return L;}
const ROBE={mbl:1,mno:1,juge:1,gjuge:1};
const JOBWP={sol:'epee',pal:'epee',arc:'arc',vol:'dague',mbl:'baton',mno:'baguette',gjuge:'baton'};
function drawWeapon(c,wp,L){
  c.lineWidth=1.2;

async function judgeCard(u,law,killed){u.cards++;const red=u.cards>=2||killed;B.cardShow=red?2:1;sfx('sifflet');if(B.judge)camTo(B.judge.x,B.judge.y);

/* --- tours --- */
const spdEff=u=>Math.max(1,u.st.spd*(u.status.lent?.5:1)*(u.status.hate?1.5:1));

function endOfTurn(u,cost){if(u.colosse)cost=Math.round(cost*.85);u.ct=Math.max(0,u.ct-cost);for(const k in u.status){if(k==='averti')continue;if(--u.status[k]<=0)delete u.status[k];}u.mp=Math.min(u.st.mp,u.mp+3);}

/* --- Comportement ennemi --- */
function actsOf(u){const a=[{id:'atk'}];for(const id of u.ab){const d=AB[id];if(d.t==='steal'||d.t==='react')continue;if((d.mp||0)>u.mp)continue;a.push({id});}return a;}

    B.hl.aoe=new Set(aoeTiles(best.act,best.q.x,best.q.y).map(t=>key(t.x,t.y)));await sleep(FAST?1:320);B.hl.aoe=new Set();await doAction(u,best.act,best.q.x,best.q.y);B.acted=true;}

  enter(){this.resize();const n=NODES[GS.node];WD.x=n.x;WD.y=n.y;WD.cx=n.x;WD.cy=n.y;},

  clampCam(){const hw=W/2/WD.s,hh=H/2/WD.s;WD.cx=hw>=500?500:clamp(WD.cx,hw,1000-hw);WD.cy=hh>=350?350:clamp(WD.cy,hh-40,700-hh+90);},
  drag(dx,dy){WD.cx-=dx/WD.s;WD.cy-=dy/WD.s;WD.free=true;this.clampCam();},
